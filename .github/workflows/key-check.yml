# One-off check: is the Firebase web key limited to the app's website? Prints only status codes.
name: Firebase key check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          K=$(grep -o 'apiKey: *"[^"]*"' firebase-config.js | cut -d'"' -f2)
          try() { R=$(curl -s -w ' HTTP %{http_code}' -H 'Content-Type: application/json' ${1:+-H "Referer: $1"} \
            -d '{"email":"nobody@example.invalid","password":"x","returnSecureToken":true}' \
            "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=$K");
            echo "$2 → $(echo "$R" | grep -o '"message": *"[^"]*"' | head -1) ${R##* HTTP }"; }
          try "https://cassiomariano.github.io/filming-schedule/" "From the app's website (should be a login error, not blocked)"
          try "https://some-copy.example.com/" "From another website (should be blocked, 403)"
          try "" "From no website (should be blocked, 403)"
