# Reads your Yahoo inboxes every 30 minutes and adds new availability checks
# to your schedule. You can also run it by hand: Actions tab → "Check email" → Run workflow.
name: Check email

on:
  schedule:
    - cron: "7,37 * * * *"        # every 30 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:
    inputs:
      days_back:
        description: "How many days of email to look at"
        default: "3"

concurrency:
  group: check-email             # never run two checks at the same time

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: node scripts/check-email.js
        env:
          DAYS_BACK: ${{ github.event.inputs.days_back || '3' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          YAHOO_EMAIL_1: ${{ secrets.YAHOO_EMAIL_1 }}
          YAHOO_APP_PASSWORD_1: ${{ secrets.YAHOO_APP_PASSWORD_1 }}
          YAHOO_EMAIL_2: ${{ secrets.YAHOO_EMAIL_2 }}
          YAHOO_APP_PASSWORD_2: ${{ secrets.YAHOO_APP_PASSWORD_2 }}
