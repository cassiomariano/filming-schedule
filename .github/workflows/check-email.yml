# Reads your Yahoo inboxes and adds new availability checks to your schedule.
# It is started every 5 minutes by a free timer at cron-job.org (see SETUP.md "Faster checks"),
# with GitHub's own schedule below as a back-up. You can also run it by hand:
# Actions tab → "Check email" → Run workflow.
name: Check email

on:
  schedule:
    - cron: "7,37 * * * *"        # every 30 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:
    inputs:
      days_back:
        description: "How many days of email to look at"
        default: "2"
      cleanup:
        description: "Also remove wrongly added calls (not from casting agencies)"
        type: boolean
        default: false
      test_alert:
        description: "Send a test notification to my phone"
        type: boolean
        default: false
      find:
        description: "Find an email: words from its subject (reports only yes/no facts)"
        default: ""
      rebuild:
        description: "Re-read everything: all folders, oldest first, work out each job's status again (no phone alerts)"
        type: boolean
        default: false
      export:
        description: "Private export (sealed) to the vault branch"
        type: boolean
        default: false
      patch:
        description: "Apply the sealed fixes in patch.sealed.json"
        type: boolean
        default: false
      survey:
        description: "Count words in agency email subjects (counts only)"
        type: boolean
        default: false
      portal_debug:
        description: "Check EP message pages now and report their format (counts only)"
        type: boolean
        default: false

concurrency:
  # never run two checks at the same time; a "re-read everything" run has its own lane,
  # so the 5-minute checks can't push it out of the queue
  group: check-email-${{ github.event.inputs.rebuild == 'true' && 'rebuild' || 'normal' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write             # only used to put a sealed export on the "vault" branch
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: node scripts/check-email.js
        env:
          DAYS_BACK: ${{ github.event.inputs.days_back || '2' }}
          CLEANUP: ${{ github.event.inputs.cleanup || 'false' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_ALERT: ${{ github.event.inputs.test_alert || 'false' }}
          FIND: ${{ github.event.inputs.find || '' }}
          REBUILD: ${{ github.event.inputs.rebuild || 'false' }}
          EXPORT: ${{ github.event.inputs.export || 'false' }}
          PATCH: ${{ github.event.inputs.patch || 'false' }}
          SURVEY: ${{ github.event.inputs.survey || 'false' }}
          PORTAL_DEBUG: ${{ github.event.inputs.portal_debug == 'true' && 'yes' || '' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          YAHOO_EMAIL_1: ${{ secrets.YAHOO_EMAIL_1 }}
          YAHOO_APP_PASSWORD_1: ${{ secrets.YAHOO_APP_PASSWORD_1 }}
          YAHOO_EMAIL_2: ${{ secrets.YAHOO_EMAIL_2 }}
          YAHOO_APP_PASSWORD_2: ${{ secrets.YAHOO_APP_PASSWORD_2 }}
      - name: Put the sealed export on the vault branch
        if: ${{ github.event.inputs.export == 'true' }}
        run: |
          mkdir /tmp/v && cp export.sealed.json /tmp/v/
          cd /tmp/v && git init -q -b vault && git add export.sealed.json
          git -c user.name=robot -c user.email=robot@users.noreply.github.com commit -q -m "sealed export"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" vault
