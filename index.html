<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15181D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Filming">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Filming Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a call-sheet board — sticky slate header with tabs, one working surface below (calendar / calls / stats), editor slides in from the right (full screen on phones). Status colours follow the spreadsheet legend. */
:root{
  --bg:#EEF0F2; --surface:#FFFFFF; --surface-2:#F6F7F9; --ink:#15181D; --muted:#5C6370; --faint:#8A919C; --line:#D9DCE2;
  --accent:#2F3BD1; --accent-ink:#FFFFFF; --accent-soft:#E3E5FB;
  --slate:#15181D; --slate-ink:#F4F5F7;
  --st-pending:#FFFFFF; --st-pending-fg:#15181D;
  --st-available:#F6D432; --st-available-fg:#15181D;
  --st-confirmed:#78C043; --st-confirmed-fg:#0E1A06;
  --st-done:#1FA6E0; --st-done-fg:#04161F;
  --st-released:#737985; --st-released-fg:#FFFFFF;
  --st-canceled:#C3C7CE; --st-canceled-fg:#3C424C;
  --st-declined:#3A3E46; --st-declined-fg:#E9EBEE;
  --attn:#E0372B; --night:#4A3DB5; --clash:#E0372B;
  --shadow:0 18px 48px rgba(18,22,30,.18);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101216; --surface:#191C22; --surface-2:#1F232A; --ink:#ECEEF2; --muted:#A0A7B3; --faint:#737B88; --line:#2C3139;
  --accent:#8F96FF; --accent-ink:#0E1030; --accent-soft:#262A55;
  --slate:#07080A; --slate-ink:#F4F5F7;
  --st-pending:#191C22; --st-pending-fg:#ECEEF2;
  --st-available:#E7C62A; --st-available-fg:#15181D;
  --st-confirmed:#6BB23A; --st-confirmed-fg:#0B1505;
  --st-done:#1E98CF; --st-done-fg:#03121A;
  --st-released:#5A606B; --st-released-fg:#F1F2F4;
  --st-canceled:#3A3F48; --st-canceled-fg:#B7BCC5;
  --st-declined:#C9CDD4; --st-declined-fg:#1A1D22;
  --attn:#FF5A4E; --night:#A79DFF; --clash:#FF5A4E;
  --shadow:0 18px 48px rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101216; --surface:#191C22; --surface-2:#1F232A; --ink:#ECEEF2; --muted:#A0A7B3; --faint:#737B88; --line:#2C3139;
  --accent:#8F96FF; --accent-ink:#0E1030; --accent-soft:#262A55;
  --slate:#07080A; --slate-ink:#F4F5F7;
  --st-pending:#191C22; --st-pending-fg:#ECEEF2;
  --st-available:#E7C62A; --st-available-fg:#15181D;
  --st-confirmed:#6BB23A; --st-confirmed-fg:#0B1505;
  --st-done:#1E98CF; --st-done-fg:#03121A;
  --st-released:#5A606B; --st-released-fg:#F1F2F4;
  --st-canceled:#3A3F48; --st-canceled-fg:#B7BCC5;
  --st-declined:#C9CDD4; --st-declined-fg:#1A1D22;
  --attn:#FF5A4E; --night:#A79DFF; --clash:#FF5A4E;
  --shadow:0 18px 48px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
pre.raw{white-space:pre-wrap;font-family:var(--f-mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:320px;overflow:auto;margin:6px 0 0}
.review-note{background:var(--accent-soft);border-radius:8px;padding:8px 10px;font-size:13px}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--slate);color:var(--slate-ink)}
.top-inner{max-width:1240px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.brand-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.clap{width:34px;height:26px;flex:none;border-radius:3px;background:repeating-linear-gradient(-45deg,var(--slate-ink) 0 6px,var(--slate) 6px 12px);border:2px solid var(--slate-ink)}
h1{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.sync{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.75;display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:#7C818A;display:inline-block}
.sync.live i{background:#78C043;box-shadow:0 0 0 3px rgba(120,192,67,.25)}
.sync.err i{background:#E0372B}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{padding:5px 9px;font-size:12px;border-radius:6px}
.btn.danger{color:var(--attn);border-color:color-mix(in srgb,var(--attn) 40%,var(--line))}
.top .btn.ghost{color:var(--slate-ink);border-color:rgba(255,255,255,.25)}
.top .btn.primary{background:#F6D432;color:#15181D;border-color:#F6D432}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;color:var(--slate-ink);opacity:.6;padding:10px 14px 12px;font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;border-bottom:3px solid transparent;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{opacity:1;border-bottom-color:#F6D432}
.count{font-family:var(--f-mono);font-size:11px;background:rgba(255,255,255,.14);border-radius:10px;padding:1px 7px;letter-spacing:0}
.count.hot{background:var(--attn);color:#fff}

main{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}

/* ---------- legend & alerts ---------- */
.legend{display:flex;flex-wrap:wrap;gap:6px 6px;align-items:center}
.legend .lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 10px 4px 6px;font-size:12px;font-weight:600;cursor:pointer;user-select:none}
.fchip[aria-pressed="false"]{opacity:.45}
.fchip[aria-pressed="false"] .sw{filter:grayscale(1)}
.sw{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.15)}
.alerts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.alert{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--attn);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.alert.reply{border-left-color:var(--st-available)}
.alert h3{margin:0;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.alert ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.alert li{display:flex;gap:8px;align-items:baseline;min-width:0}
.alert li button{background:none;border:0;padding:0;cursor:pointer;text-align:left;font-weight:600;min-width:0;max-width:65%;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert li button:hover{text-decoration:underline}
.alert .when{font-family:var(--f-mono);font-size:11px;color:var(--muted);flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert li .when:first-child{flex:none}

/* ---------- toolbar ---------- */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.month-title{font-family:var(--f-display);font-weight:800;font-size:28px;text-transform:uppercase;letter-spacing:.02em;margin:0 6px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
.inp:focus{border-color:var(--accent);outline:none}

/* ---------- month grid ---------- */
.grid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.month{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));min-width:830px}
.dow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.day{min-height:118px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;position:relative;min-width:0}
.day:nth-child(7n){border-right:0}
.day.out{background:var(--surface-2)}
.day.out .dnum{opacity:.4}
.dhead{display:flex;align-items:center;gap:6px}
.dnum{font-family:var(--f-mono);font-size:12px;font-weight:600}
.day.today .dnum{background:var(--ink);color:var(--bg);border-radius:4px;padding:0 5px}
.clash{font-family:var(--f-mono);font-size:10px;font-weight:600;color:#fff;background:var(--clash);border-radius:3px;padding:0 4px;letter-spacing:.04em;text-transform:uppercase}
.ev{display:flex;align-items:center;gap:4px;border-radius:4px;padding:2px 5px;font-size:11.5px;font-weight:600;line-height:1.3;cursor:pointer;border:1px solid transparent;text-align:left;width:100%;min-width:0}
h3.wk{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 0;font-weight:600}
.ups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:10px}
.up{background:var(--surface);border:1px solid var(--line);border-left-width:6px;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.s-pending-edge{border-left-color:var(--faint)}.s-available-edge{border-left-color:var(--st-available)}.s-confirmed-edge{border-left-color:var(--st-confirmed)}
.uphead{cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.uphead h4{margin:0;font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere}
.upst{align-self:flex-start;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:20px;padding:2px 9px}
.upmeta{font-size:12.5px;color:var(--muted)}
.uprow{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:start}
.uplab{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.updays{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.upday{font:inherit;font-size:13px;font-weight:600;border:1px solid transparent;border-radius:6px;padding:2px 8px;cursor:pointer;text-align:left}
.upday:hover{outline:2px solid var(--accent);outline-offset:1px}
.upday small{font-weight:400;opacity:.8}
.upday.off{text-decoration:line-through;font-weight:400}
.upday.upclash{border-color:var(--clash);box-shadow:inset 0 0 0 1px var(--clash)}
.upacts{display:flex;gap:6px;flex-wrap:wrap}
.outside{display:inline-block;font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:#fff;background:var(--attn);border-radius:4px;padding:1px 6px;white-space:nowrap}
.maplink{font-size:12px;color:var(--accent);white-space:nowrap}
.muted{color:var(--faint)}
.nextjob{background:var(--st-confirmed);color:var(--st-confirmed-fg);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.nextjob .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.nextjob h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;text-transform:uppercase}
.nextjob .muted{color:inherit;opacity:.7}
.nj-line{font-size:15px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btable{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bhead,.brow{display:grid;grid-template-columns:150px 120px minmax(0,1.2fr) minmax(0,1.4fr);gap:12px;padding:10px 14px;align-items:center}
.bhead{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line)}
.brow{border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow.past{opacity:.6}
.bdate{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.bdate small,.bprod small{color:var(--muted);font-size:12px;display:block}
.btime b{font-family:var(--f-display);font-size:24px;font-weight:800}
.btime .muted{font-size:12.5px}
.bprod{cursor:pointer;min-width:0}
.bplace{font-size:13px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}
@media (max-width:760px){.bhead{display:none}.brow{grid-template-columns:auto 1fr;gap:6px 12px}.bprod,.bplace{grid-column:1/-1}}
.dextra{flex:1 1 100%;display:flex;gap:6px;align-items:center}
.dextra .loc{flex:1 1 auto;min-width:0}
.ct{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;color:var(--muted)}
.ct .inp{width:110px}
a.btn{text-decoration:none}
.btn.yes{background:var(--st-confirmed);color:var(--st-confirmed-fg);border-color:var(--st-confirmed)}
.ev .k{font-family:var(--f-mono);font-size:9px;font-weight:600;opacity:.75;flex:none;letter-spacing:.03em}
.ev .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ev .m{flex:none;font-size:11px}
.ev.attn{box-shadow:inset 3px 0 0 var(--attn)}
.ev.x .t{text-decoration:line-through}
.more{background:none;border:0;padding:0 4px;font-size:11px;color:var(--muted);cursor:pointer;text-align:left;font-weight:600}
.s-pending{background:var(--st-pending);color:var(--st-pending-fg);border:1px dashed var(--faint)!important}
.s-available{background:var(--st-available);color:var(--st-available-fg)}
.s-confirmed{background:var(--st-confirmed);color:var(--st-confirmed-fg)}
.s-done{background:var(--st-done);color:var(--st-done-fg)}
.s-released{background:var(--st-released);color:var(--st-released-fg)}
.s-canceled{background:var(--st-canceled);color:var(--st-canceled-fg)}
.s-declined{background:var(--st-declined);color:var(--st-declined-fg)}

/* ---------- agenda ---------- */
.agenda{display:flex;flex-direction:column;gap:10px}
.aday{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:start}
.adate{font-family:var(--f-display);text-transform:uppercase;line-height:1;padding-top:4px}
.adate b{display:block;font-size:30px;font-weight:800}
.adate span{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.aday.today .adate b{color:var(--accent)}
.alist{display:flex;flex-direction:column;gap:6px;min-width:0}
.acard{display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px 8px 0;cursor:pointer;text-align:left;width:100%;overflow:hidden;min-width:0}
.acard .bar8{align-self:stretch;border-radius:0}
.acard .main{min-width:0;display:flex;flex-direction:column;gap:1px}
.acard .ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acard .sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kind{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}
.clash-row{font-family:var(--f-mono);font-size:11px;color:var(--clash);font-weight:600;letter-spacing:.04em;text-transform:uppercase}

/* ---------- calls list ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:grid;grid-template-columns:6px minmax(0,1fr) auto;overflow:hidden}
.row .stripe{align-self:stretch}
.stripe.s-pending,.bar8.s-pending{background:var(--faint);border:0!important}
.row .body{padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;cursor:pointer}
.row .line1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.proj{font-weight:600;font-size:15px}
.pill{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:20px;padding:2px 8px;white-space:nowrap}
.flag{font-family:var(--f-mono);font-size:10px;font-weight:600;color:var(--attn);letter-spacing:.06em;text-transform:uppercase}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);min-width:0}
.meta b{color:var(--ink);font-weight:600}
.dates{display:flex;flex-wrap:wrap;gap:4px}
.dchip{cursor:pointer;font:inherit;font-family:var(--f-mono);font-size:12px;font-weight:600;border:1px solid transparent;border-radius:5px;padding:2px 7px;white-space:nowrap}
.dchip:hover{outline:2px solid var(--accent);outline-offset:1px}
.dchip.off{text-decoration:line-through}
.row .acts{display:flex;flex-direction:column;gap:6px;padding:10px 12px 10px 0;justify-content:center;align-items:stretch;max-width:220px}
.due{font-family:var(--f-mono);font-size:11px;font-weight:600}
.due.late{color:var(--attn)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h2{margin:0;font-family:var(--f-display);font-size:24px;text-transform:uppercase;color:var(--ink)}

/* ---------- stats ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .n{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .s{font-size:12px;color:var(--muted)}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.panel .hint{font-size:12px;color:var(--muted);margin:-6px 0 0}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover+rect,.chart g.col:hover rect.mark{opacity:.8}
.hbars{display:flex;flex-direction:column;gap:6px}
.hb{display:grid;grid-template-columns:minmax(90px,34%) 1fr 64px;gap:8px;align-items:center;font-size:12.5px;min-width:0}
.hb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .track{height:14px;display:flex;gap:2px;min-width:0}
.hb .track span{height:100%;border-radius:0 3px 3px 0;min-width:2px}
.hb .v{font-family:var(--f-mono);font-size:11px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.keyrow{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.keyrow span{display:inline-flex;gap:6px;align-items:center}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:6px;max-width:240px;box-shadow:var(--shadow)}

/* ---------- sheet (editor) ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:50;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet header h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .content{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.sheet footer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label,.fld .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
textarea.inp{min-height:84px;resize:vertical}
.status-pick{display:flex;flex-wrap:wrap;gap:6px}
.status-pick button{border-radius:20px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;border:2px solid transparent}
.status-pick button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.drows{display:flex;flex-direction:column;gap:6px}
.drow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.drow .inp{padding:6px 8px}
.drow .dd{flex:1 1 140px;min-width:0}
.drow .dk{flex:0 0 84px}
.drow .dst{flex:0 0 112px}
.dst-worked{background:var(--st-done);color:var(--st-done-fg)}
.dst-canceled,.dst-released{background:var(--st-canceled);color:var(--st-canceled-fg)}
.ibtn{flex:0 0 34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:14px;padding:0;color:var(--ink)}
.ibtn input{position:absolute;opacity:0;pointer-events:none}
.ibtn:has(input:checked),.ibtn.on{background:var(--night);color:#fff;border-color:var(--night)}
.ibtn.on{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
details.more{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
details.more summary{cursor:pointer;font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.more-in{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.tog{display:inline-flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap}
.drop{border:2px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.status-line{font-size:12.5px;color:var(--muted);min-height:1.2em}
.status-line.err{color:var(--attn)}
.confirm{background:var(--surface-2);border:1px solid var(--attn);border-radius:8px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:70;font-weight:600;font-size:13px;box-shadow:var(--shadow)}
.src{font-size:11px;color:var(--faint);font-family:var(--f-mono)}
@media (max-width:640px){
  h1{font-size:24px}
  .month-title{font-size:22px}
  .row{grid-template-columns:6px minmax(0,1fr)}
  .row .acts{flex-direction:row;padding:0 12px 10px;grid-column:2}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand-row">
      <span class="clap" aria-hidden="true"></span>
      <h1>Filming Schedule</h1>
      <span class="sync" id="sync"><i></i><span>Connecting…</span></span>
      <span class="spacer"></span>
      <button class="btn ghost small" id="exportBtn" hidden>Backup</button>
      <button class="btn primary" id="addBtn">+ Add availability check</button>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="calendar" aria-selected="true">Calendar</button>
      <button class="tab" role="tab" data-tab="booked" aria-selected="false">Booked <span class="count" id="bookedCount" hidden></span></button>
      <button class="tab" role="tab" data-tab="calls" aria-selected="false">Calls <span class="count" id="replyCount" hidden></span></button>
      <button class="tab" role="tab" data-tab="stats" aria-selected="false">Stats</button>
    </nav>
  </div>
</header>

<main id="main">
  <div class="empty" id="boot">
    <h2>Loading your calls</h2>
    <p>Your availability checks, bookings and fittings appear here as soon as the schedule connects.</p>
  </div>
</main>

<div id="layer"></div>

<!-- Firebase (database + sign-in), your settings, and the email reader -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="parser.js"></script>
<script>
(() => {
"use strict";
/* ================= constants ================= */
const STATUSES = [
  {k:"pending",   label:"New – reply needed", short:"New"},
  {k:"available", label:"Available (accepted)", short:"Available"},
  {k:"confirmed", label:"Confirmed booking", short:"Confirmed"},
  {k:"done",      label:"Done / worked", short:"Done"},
  {k:"declined",  label:"Declined", short:"Declined"},
  {k:"released",  label:"Released", short:"Released"},
  {k:"canceled",  label:"Canceled", short:"Canceled"},
];
const SMAP = Object.fromEntries(STATUSES.map(s => [s.k, s]));
/* the name to show for a call: production, else the email subject */
function nameOf(c){ return (c.project || "").trim() || (c.emailSubject || "").trim() || "No production name – open to add"; }
/* what each status means, in plain words, for the Upcoming cards */
const MEANS = {pending:"New – reply needed", available:"Available – waiting to hear", confirmed:"Booked ✓", done:"Worked", declined:"Declined", released:"Released", canceled:"Canceled"};
const ACTIVE = new Set(["pending","available","confirmed"]);
const STRUCK = new Set(["declined","released","canceled"]);
const PRIORITY = {confirmed:0, available:1, pending:2, done:3, released:4, canceled:5, declined:6};
const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

/* ================= state ================= */
const S = {
  calls: new Map(), loaded:false, db:null, canWrite:true, userEmail:"",
  tab: load("tab","calendar"), cursor: monthStart(new Date()),
  calView: load("calView2", "upcoming"),
  show: new Set(load("show", ["pending","available","confirmed","done"])),
  q:"", agency:"", sort: load("sort","next"), listStatus: load("listStatus","open"),
  basis: load("basis","received"),
};
function load(k, d){ try { const v = localStorage.getItem("fs:"+k); return v ? JSON.parse(v) : d; } catch { return d; } }
function save(k, v){ try { localStorage.setItem("fs:"+k, JSON.stringify(v)); } catch {} }

/* ================= date helpers (dates are local YYYY-MM-DD strings) ================= */
const pad = n => String(n).padStart(2,"0");
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
function monthStart(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function weekStart(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; }
const TODAY = key(new Date());
const fmtShort = k => { const d = parse(k); return `${DOW[(d.getDay()+6)%7]} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`; };
const fmtDM = k => { const d = parse(k); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}${d.getFullYear() !== new Date().getFullYear() ? " "+String(d.getFullYear()).slice(2) : ""}`; };
function dueText(iso){
  if (!iso) return "";
  const t = new Date(iso.length <= 10 ? iso+"T23:59" : iso);
  const h = (t - new Date())/36e5;
  if (h < 0) return {txt:"Reply deadline passed", late:true};
  if (h < 24) return {txt:`Reply within ${Math.max(1,Math.round(h))}h`, late:true};
  return {txt:`Reply by ${DOW[(t.getDay()+6)%7]} ${t.getDate()} ${MONTHS[t.getMonth()].slice(0,3)} ${pad(t.getHours())}:${pad(t.getMinutes())}`, late:h<48};
}

/* ================= helpers ================= */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clsS = st => "s-" + (SMAP[st] ? st : "pending");
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2400); }
function callList(){ return [...S.calls.values()]; }
function nextDate(c){ const fut = (c.dates||[]).filter(e => e.d >= TODAY).map(e => e.d).sort(); return fut[0] || null; }
function firstDate(c){ const all = (c.dates||[]).map(e => e.d).sort(); return all[0] || null; }
function lastDate(c){ const all = (c.dates||[]).map(e => e.d).sort(); return all[all.length-1] || null; }

const AGENCY_ALIASES = {extrapeople:"Extra People",two10:"Two 10 Casting",two10casting:"Two 10 Casting",castingcollective:"Casting Collective",keycasting:"Key Casting",universalextras:"Universal Extras",lucasextras:"Lucas Extras",cameraactionextras:"Camera Action Extras",cameraaction:"Camera Action Extras",wilkins:"Wilkins Casting",wilkinscasting:"Wilkins Casting",wilkinscastingltd:"Wilkins Casting",sabellcasting:"Sabell Casting",sabell:"Sabell Casting",bbbtalent:"BBB Talent",bbb:"BBB Talent",bbbtalentagency:"BBB Talent",bbbtalentteam:"BBB Talent",onsetextras:"On Set Extras",onset:"On Set Extras",trueedge:"True Edge",castingcollectiveltd:"Casting Collective"};
function normAgency(a){ const s = (a||"").trim(); const k = s.toLowerCase().replace(/[^a-z0-9]/g,""); return AGENCY_ALIASES[k] || s; }

/* the status of ONE day: a single day can be released, canceled or worked
   even when the rest of the booking is still on */
const DAY_STATES = [["", "Same as the call"], ["worked", "Worked"], ["released", "Released"], ["canceled", "Canceled"]];
function dayStatus(c, e){
  if (e.state === "released") return "released";
  if (e.state === "canceled") return "canceled";
  if (e.state === "worked" || e.done) return "done";
  return c.status;
}

/* tap a day: booked → worked (blue) → canceled (grey) → released (grey) → booked */
const CYCLE = ["", "worked", "canceled"];
const CYCLE_WORDS = {"": "back to automatic colour", worked: "done ✓ (blue)", canceled: "canceled (grey)", released: "released (grey)"};
async function cycleDay(id, i){
  const c = S.calls.get(id); if (!c || !c.dates || !c.dates[i]) return;
  const dates = c.dates.map(e => ({...e}));
  const e = dates[i];
  const now = e.state || (e.done ? "worked" : "");
  const next = CYCLE[(CYCLE.indexOf(now) + 1) % CYCLE.length];
  delete e.done;
  if (next) e.state = next; else delete e.state;
  try {
    await S.db.collection("calls").doc(id).update({dates, updatedAt: new Date().toISOString()});
    toast(`${nameOf(c)} · ${fmtShort(e.d)}: ${CYCLE_WORDS[next]}`);
  } catch (err) { writeFailed(err); }
}
const DAY_TIP = "Tap: done (blue) → canceled (grey) → automatic";

/* entries per day for the calendar */
function dayIndex(){
  const m = new Map();
  for (const c of S.calls.values()){
    for (const e of (c.dates||[])){
      if (!m.has(e.d)) m.set(e.d, []);
      m.get(e.d).push({c, e});
    }
  }
  for (const arr of m.values()) arr.sort((a,b) => PRIORITY[dayStatus(a.c,a.e)]-PRIORITY[dayStatus(b.c,b.e)] || (a.c.project||"").localeCompare(b.c.project||""));
  return m;
}
function clashes(idx){
  const out = new Map();
  for (const [d, arr] of idx){
    const act = arr.filter(x => ACTIVE.has(dayStatus(x.c, x.e)));
    const ids = new Set(act.map(x => x.c.id));
    if (ids.size >= 2 && act.some(x => dayStatus(x.c, x.e) === "confirmed")) out.set(d, act);
  }
  return out;
}

/* ================= rendering ================= */
const main = $("#main");
function render(){
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === S.tab)));
  const needReply = callList().filter(c => c.status === "pending").length;
  const rc = $("#replyCount"); rc.hidden = !needReply; rc.textContent = needReply; rc.className = "count hot";
  if (!S.loaded) return;
  const bc = $("#bookedCount"); const nb = bookedDays(false).length; bc.hidden = !nb; bc.textContent = nb;
  if (S.tab === "calendar") renderCalendar();
  else if (S.tab === "booked") renderBooked();
  else if (S.tab === "calls") renderCalls();
  else renderStats();
}

function legendHTML(){
  return `<div class="legend" role="group" aria-label="Show statuses"><span class="lab">Show</span>${
    STATUSES.map(s => `<button class="fchip" data-show="${s.k}" aria-pressed="${S.show.has(s.k)}"><span class="sw ${clsS(s.k)}"></span>${s.short}</button>`).join("")
  }<span class="fchip" style="cursor:default" aria-pressed="true"><span class="sw" style="background:var(--night)"></span>☾ Night</span><span class="fchip" style="cursor:default" aria-pressed="true"><span class="sw" style="background:var(--attn)"></span>Attention</span></div>`;
}

function alertsHTML(idx){
  const pend = callList().filter(c => c.status === "pending").sort((a,b) => (a.respondBy||"9").localeCompare(b.respondBy||"9"));
  const cl = [...clashes(idx)].filter(([d]) => d >= TODAY).sort((a,b) => a[0].localeCompare(b[0]));
  const rev = callList().filter(c => c.review).sort((a,b) => (b.received||"").localeCompare(a.received||""));
  if (!pend.length && !cl.length && !rev.length) return "";
  let h = `<div class="alerts">`;
  if (rev.length) h += `<section class="alert" style="border-left-color:var(--accent)"><h3>From your email · check details · ${rev.length}</h3><ul>${rev.slice(0,6).map(c =>
      `<li><button data-open="${c.id}">${esc(nameOf(c))}</button><span class="when">${esc(c.agency||"")}${c.reviewReason ? " · "+esc(c.reviewReason) : ""}</span></li>`).join("")}</ul></section>`;
  if (pend.length) h += `<section class="alert reply"><h3>Waiting for your reply · ${pend.length}</h3><ul>${pend.slice(0,6).map(c => {
      const du = dueText(c.respondBy);
      return `<li><button data-open="${c.id}">${esc(nameOf(c))}</button><span class="when">${esc(c.agency||"")}${du ? " · "+esc(du.txt) : ""}</span></li>`;}).join("")}</ul></section>`;
  if (cl.length) h += `<section class="alert"><h3>Booking clashes ahead · ${cl.length}</h3><ul>${cl.slice(0,6).map(([d,arr]) =>
      `<li><span class="when">${fmtShort(d)}</span><button data-day="${d}">${esc([...new Set(arr.map(x => nameOf(x.c)))].join(" / "))}</button></li>`).join("")}</ul></section>`;
  return h + `</div>`;
}

function renderCalendar(){
  const idx = dayIndex();
  const cl = clashes(idx);
  const m = S.cursor;
  let h = alertsHTML(idx);
  h += `<div class="bar">
      <button class="btn small" data-nav="-1" aria-label="Previous month">◀</button>
      <button class="btn small" data-nav="0">Today</button>
      <button class="btn small" data-nav="1" aria-label="Next month">▶</button>
      <h2 class="month-title">${MONTHS[m.getMonth()]} ${m.getFullYear()}</h2>
      <span class="spacer" style="flex:1"></span>
      <div class="seg" role="group" aria-label="Calendar view"><button data-calview="upcoming" aria-pressed="${S.calView==="upcoming"}">Upcoming</button><button data-calview="month" aria-pressed="${S.calView==="month"}">Month</button><button data-calview="agenda" aria-pressed="${S.calView==="agenda"}">Agenda</button></div>
    </div>${legendHTML()}`;
  const vis = x => S.show.has(dayStatus(x.c, x.e));
  if (S.calView === "upcoming"){
    h = alertsHTML(idx) + upcomingHTML(cl);
    main.innerHTML = h;
    return;
  }
  if (S.calView === "month"){
    const start = weekStart(m);
    h += `<div class="grid-wrap"><div class="month">${DOW.map(d => `<div class="dow">${d}</div>`).join("")}`;
    for (let i = 0; i < 42; i++){
      const d = new Date(start); d.setDate(start.getDate()+i);
      if (i >= 35 && d.getMonth() !== m.getMonth()) break;
      const k = key(d);
      const items = (idx.get(k) || []).filter(vis);
      const isClash = cl.has(k);
      h += `<div class="day${d.getMonth()!==m.getMonth()?" out":""}${k===TODAY?" today":""}"><div class="dhead"><span class="dnum">${d.getDate()}</span>${isClash?`<span class="clash" title="A confirmed booking overlaps another call on this day">Clash</span>`:""}</div>`;
      items.slice(0,4).forEach(x => h += evHTML(x));
      if (items.length > 4) h += `<button class="more" data-day="${k}">+${items.length-4} more</button>`;
      h += `</div>`;
    }
    h += `</div></div>`;
  } else {
    const from = key(m) < TODAY && key(new Date(m.getFullYear(), m.getMonth()+1, 0)) >= TODAY ? TODAY : key(m);
    const to = key(new Date(m.getFullYear(), m.getMonth()+2, 0));
    const days = [...idx.keys()].filter(d => d >= from && d <= to).sort();
    let any = false;
    h += `<div class="agenda">`;
    for (const d of days){
      const items = idx.get(d).filter(vis);
      if (!items.length) continue;
      any = true;
      const dd = parse(d);
      h += `<div class="aday${d===TODAY?" today":""}" id="d-${d}"><div class="adate"><b>${dd.getDate()}</b><span>${DOW[(dd.getDay()+6)%7]} ${MONTHS[dd.getMonth()].slice(0,3)}</span></div><div class="alist">`;
      if (cl.has(d)) h += `<div class="clash-row">⚠ Clash — a confirmed booking overlaps ${cl.get(d).length-1} other call${cl.get(d).length>2?"s":""}</div>`;
      items.forEach(({c,e}) => { const ds = dayStatus(c,e); h += `<button class="acard" data-open="${c.id}"><span class="bar8 ${clsS(ds)}"></span><span class="main"><span class="ttl"${STRUCK.has(ds)?' style="text-decoration:line-through"':''}>${e.night?"☾ ":""}${esc(nameOf(c))}${ds!==c.status?` <span class="pill ${clsS(ds)}">day ${SMAP[ds].short.toLowerCase()}</span>`:""}${c.attention?` <span class="flag">● attention</span>`:""}</span><span class="sub">${esc([c.agency, c.role, e.loc || (e.kind==="fit"?c.fitLocation:c.filmLocation) || c.location].filter(Boolean).join(" · "))}</span></span><span class="kind">${e.kind==="fit"?"Fitting":"Shoot"}</span></button>`; });
      h += `</div></div>`;
    }
    if (!any) h += `<div class="empty"><h2>Nothing scheduled</h2><p>No dates for the selected statuses between ${fmtDM(from)} and ${fmtDM(to)}.</p></div>`;
    h += `</div>`;
  }
  main.innerHTML = h;
}
/* where you go on a given day: call-time place, else the day's place, else the call's */
function placeOf(c, e){ return e.callPlace || e.loc || (e.kind==="fit" ? c.fitLocation : c.filmLocation) || c.location || ""; }
function outsideBadge(place){
  return window.EmailParser && EmailParser.londonCheck(place) === "outside" ? `<span class="outside" title="This job is not in London – plan travel">⚠ Outside London</span>` : "";
}
function mapLink(place){ return place ? `<a class="maplink" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place)}" target="_blank" rel="noopener">Map ↗</a>` : ""; }

/* every booked day (green), soonest first */
function bookedDays(includePast){
  const out = [];
  for (const c of S.calls.values()) for (const e of (c.dates||[])){
    const st = dayStatus(c, e);
    if (st === "confirmed" || (includePast && st === "done")) if (includePast || e.d >= TODAY) out.push({c, e});
  }
  return out.sort((a,b) => a.e.d.localeCompare(b.e.d) || (a.e.callTime||"99").localeCompare(b.e.callTime||"99"));
}
function daysAway(d){
  const n = Math.round((parse(d) - parse(TODAY)) / 864e5);
  return n === 0 ? "Today" : n === 1 ? "Tomorrow" : n > 1 ? `in ${n} days` : `${-n} days ago`;
}

/* The Booked tab: date · call time · production · location, one line per booked day */
function renderBooked(){
  const rows = bookedDays(S.showPastBooked);
  const ahead = rows.filter(x => x.e.d >= TODAY);
  const outside = ahead.filter(x => EmailParser.londonCheck(placeOf(x.c, x.e)) === "outside").length;
  const next = ahead[0];
  let h = "";
  if (next){

/* Reply buttons: the agency's own links (opened in a new tab) + one tap to record your answer.
   Yes/No links (e.g. True Edge) record your answer as you tap them. */
function replyHTML(c){
  const links = c.links || [];
  const yes = links.find(l => l.kind === "yes"), no = links.find(l => l.kind === "no"), respond = links.find(l => l.kind === "respond");
  let h = "";
  if (c.status === "pending"){
    if (yes) h += `<a class="btn small yes" href="${esc(yes.url)}" target="_blank" rel="noopener" data-quick="available" data-id="${c.id}">✓ Yes, available ↗</a>`;
    if (no)  h += `<a class="btn small" href="${esc(no.url)}" target="_blank" rel="noopener" data-quick="declined" data-id="${c.id}">✕ Not available ↗</a>`;
    if (respond && !(yes && no)) h += `<a class="btn small primary" href="${esc(respond.url)}" target="_blank" rel="noopener">Reply to agency ↗</a>`;
    // agency Yes/No links already record your answer; otherwise one tap to note what you said
    if (!(yes && no)) h += `<button class="btn small" data-set="available" data-id="${c.id}">✓ ${respond?"I said yes":"Accept"}</button><button class="btn small" data-set="declined" data-id="${c.id}">✕ ${respond?"I said no":"Decline"}</button>`;
  } else if (c.status === "available"){
    h += `<button class="btn small" data-set="confirmed" data-id="${c.id}">I'm booked</button><button class="btn small" data-set="released" data-id="${c.id}">Released</button>`;
  }
  if (c.emailSubject) h += `<a class="btn small ghost" href="https://mail.yahoo.com/d/search/keyword=${encodeURIComponent(c.emailSubject)}" target="_blank" rel="noopener" title="Search Yahoo Mail for this email">✉ Email ↗</a>`;
  return h;
}

/* Upcoming: one card per job — name, your status, fitting days, shoot days */
function upcomingHTML(cl){
  const active = ["pending","available","confirmed"];
  const jobs = callList()
    .filter(c => active.includes(c.status) && (c.dates||[]).some(e => e.d >= TODAY))
    .sort((a,b) => nextDate(a).localeCompare(nextDate(b)));
  const undated = callList().filter(c => active.includes(c.status) && !(c.dates||[]).length);
  let h = `<div class="bar"><h2 class="month-title" style="margin:0">Upcoming</h2><span class="src">${jobs.length} jobs with dates ahead</span><span style="flex:1"></span>
    <div class="seg" role="group" aria-label="Calendar view"><button data-calview="upcoming" aria-pressed="true">Upcoming</button><button data-calview="month" aria-pressed="false">Month</button><button data-calview="agenda" aria-pressed="false">Agenda</button></div></div>`;
  if (!jobs.length) h += `<div class="empty"><h2>Nothing coming up</h2><p>New availability checks appear here as soon as they arrive.</p></div>`;

function upCard(c, cl){

const OUT = [
  {k:"booked",  label:"Booked / worked", st:["confirmed","done"], color:"var(--st-confirmed)"},
  {k:"yes",     label:"Accepted, not booked", st:["available","released","canceled"], color:"var(--st-available)"},
  {k:"no",      label:"Declined", st:["declined"], color:"var(--st-declined)"},
  {k:"new",     label:"No reply yet", st:["pending"], color:"var(--faint)"},
];
function outcome(c){ return OUT.find(o => o.st.includes(c.status)) || OUT[3]; }
function basisDate(c){ return S.basis === "received" ? (c.received || firstDate(c)) : firstDate(c); }

function renderStats(){
  const all = callList();
  const now = new Date();
  const wk = key(weekStart(now)), mo = key(monthStart(now));
  const withD = all.filter(c => basisDate(c));
  const thisWeek = withD.filter(c => basisDate(c) >= wk).length;
  const thisMonth = withD.filter(c => basisDate(c) >= mo).length;
  const answered = all.filter(c => c.status !== "pending");
  const yes = answered.filter(c => c.status !== "declined").length;
  const booked = all.filter(c => c.status === "confirmed" || c.status === "done").length;
  const workDays = new Set(all.flatMap(c => (c.dates||[]).filter(e => e.d.slice(0,4) === String(now.getFullYear()) && ["done","confirmed"].includes(dayStatus(c,e))).map(e => e.d))).size;
  const fallback = all.filter(c => !c.received).length;

  let h = `<div class="bar"><div class="seg" role="group" aria-label="Count calls by"><button data-basis="received" aria-pressed="${S.basis==="received"}">By date received</button><button data-basis="work" aria-pressed="${S.basis==="work"}">By first work date</button></div>
    <span class="src">${S.basis==="received" && fallback ? `${fallback} imported calls have no received date, so they count on their first work date.` : ""}</span></div>
  <div class="kpis">
    <div class="kpi"><span class="l">This week</span><span class="n">${thisWeek}</span><span class="s">calls since Mon ${fmtDM(wk)}</span></div>
    <div class="kpi"><span class="l">This month</span><span class="n">${thisMonth}</span><span class="s">calls in ${MONTHS[now.getMonth()]}</span></div>
    <div class="kpi"><span class="l">Accept rate</span><span class="n">${answered.length ? Math.round(yes/answered.length*100) : 0}%</span><span class="s">${yes} accepted · ${answered.length-yes} declined</span></div>
    <div class="kpi"><span class="l">Booked</span><span class="n">${booked}</span><span class="s">confirmed or worked, all time</span></div>
    <div class="kpi"><span class="l">Days on set ${now.getFullYear()}</span><span class="n">${workDays}</span><span class="s">fitting + shoot days booked</span></div>
  </div>
  <div class="panels">
    <section class="panel"><h2>Calls per week</h2><p class="hint">Last 16 weeks, by ${S.basis==="received"?"date received":"first work date"}.</p>${weekChart(withD)}</section>
    <section class="panel"><h2>Calls per month</h2><p class="hint">Last 12 months, split by outcome.</p>${monthChart(withD)}<div class="keyrow">${OUT.map(o => `<span><i class="sw" style="background:${o.color}"></i>${o.label}</span>`).join("")}</div></section>
    <section class="panel"><h2>By agency</h2><p class="hint">All calls, split by outcome.</p>${hbars(group(all, c => c.agency || "Unknown"), 14)}</section>
    <section class="panel"><h2>By role</h2><p class="hint">What you are being called for.</p>${hbars(group(all.filter(c => c.role), c => roleKey(c.role)), 14)}</section>
  </div>`;
  main.innerHTML = h;
}
function roleKey(r){ const s = r.trim().toLowerCase().replace(/\s+/g," ").replace(/s$/,""); return s.charAt(0).toUpperCase() + s.slice(1); }
function group(list, fn){
  const m = new Map();
  for (const c of list){ const k = fn(c); if (!m.has(k)) m.set(k, {name:k, total:0, by:{}}); const g = m.get(k); g.total++; const o = outcome(c).k; g.by[o] = (g.by[o]||0)+1; }
  return [...m.values()].sort((a,b) => b.total - a.total || a.name.localeCompare(b.name));
}
function hbars(rows, n){
  if (!rows.length) return `<p class="hint">Nothing yet.</p>`;
  const top = rows.slice(0,n), max = top[0].total;
  let h = `<div class="hbars">`;
  for (const r of top){
    const tip = `${r.name}: ${r.total} calls · ` + OUT.filter(o => r.by[o.k]).map(o => `${r.by[o.k]} ${o.label.toLowerCase()}`).join(", ");
    h += `<div class="hb" data-tip="${esc(tip)}"><span class="nm" title="${esc(r.name)}">${esc(r.name)}</span><span class="track">${OUT.filter(o => r.by[o.k]).map(o => `<span style="width:${r.by[o.k]/max*100}%;background:${o.color}"></span>`).join("")}</span><span class="v">${r.total}</span></div>`;
  }
  if (rows.length > n) h += `<span class="src">+ ${rows.length-n} more</span>`;
  return h + `</div>`;
}
function weekChart(list){
  const end = weekStart(new Date()); const weeks = [];
  for (let i = 15; i >= 0; i--){ const s = new Date(end); s.setDate(end.getDate()-7*i); weeks.push(key(s)); }
  const counts = weeks.map((w,i) => { const nx = i<15 ? weeks[i+1] : "9999"; return list.filter(c => { const d = basisDate(c); return d >= w && d < nx; }).length; });
  return barSVG(weeks.map((w,i) => ({label: i%2===0 ? fmtDM(w) : "", full:`Week of ${fmtDM(w)}`, segs:[{v:counts[i], color:"var(--accent)", name:"calls"}]})));
}
function monthChart(list){
  const now = new Date(); const months = [];
  for (let i = 11; i >= 0; i--) months.push(new Date(now.getFullYear(), now.getMonth()-i, 1));
  return barSVG(months.map(m => {
    const p = key(m).slice(0,7);
    const these = list.filter(c => basisDate(c).slice(0,7) === p);
    return {label: MONTHS[m.getMonth()].slice(0,3), full:`${MONTHS[m.getMonth()]} ${m.getFullYear()}`, segs: OUT.map(o => ({v: these.filter(c => outcome(c).k===o.k).length, color:o.color, name:o.label.toLowerCase()}))};
  }));
}
function barSVG(cols){
  const W = 520, H = 190, L = 28, B = 22, T = 8;
  const max = Math.max(1, ...cols.map(c => c.segs.reduce((s,x)=>s+x.v,0)));
  const step = max <= 5 ? 1 : max <= 12 ? 2 : max <= 30 ? 5 : 10;
  const top = Math.ceil(max/step)*step;
  const y = v => T + (H-T-B) * (1 - v/top);
  const cw = (W-L)/cols.length, bw = Math.min(28, cw*0.62);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for (let v = 0; v <= top; v += step) s += `<line class="grid" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
  cols.forEach((c,i) => {
    const x = L + cw*i + (cw-bw)/2; let acc = 0;
    const tot = c.segs.reduce((a,b)=>a+b.v,0);
    const tip = `${c.full}: ${tot} call${tot===1?"":"s"}` + (c.segs.length>1 ? " · " + c.segs.filter(g=>g.v).map(g => `${g.v} ${g.name}`).join(", ") : "");
    s += `<g class="col" data-tip="${esc(tip)}"><rect class="hit" x="${L+cw*i}" y="${T}" width="${cw}" height="${H-T-B}"/>`;
    const segs = c.segs.filter(g => g.v);
    segs.forEach((g,j) => {
      const y0 = y(acc), y1 = y(acc+g.v); acc += g.v;
      const isTop = j === segs.length-1;
      const hgt = Math.max(0, y0-y1-(isTop?0:2));
      s += isTop ? `<path class="mark" d="M${x},${y0} V${y1+3} q0,-3 3,-3 h${bw-6} q3,0 3,3 V${y0} Z" fill="${g.color}"/>` : `<rect class="mark" x="${x}" y="${y1+2}" width="${bw}" height="${hgt}" fill="${g.color}"/>`;
    });
    s += `<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${esc(c.label)}</text></g>`;
  });
  return s + `</svg>`;
}

function blankCall(){ return {project:"", agency:"", role:"", status:"pending", attention:false, location:"", fitLocation:"", filmLocation:"", rate:"", notes:"", received:TODAY, respondBy:"", dates:[], source:"manual"}; }
function openEditor(id, preset){

function drawEditor(){

let preset_note = "";
function pullForm(){
  if (!draft) return;
  const v = id => { const el = $("#"+id, layer); return el ? el.value.trim() : ""; };
  draft.project = v("f-project"); draft.agency = normAgency(v("f-agency")); draft.role = v("f-role");
  draft.received = v("f-received") || null; draft.respondBy = v("f-respond") || null;
  draft.location = v("f-location"); draft.fitLocation = v("f-fitloc"); draft.filmLocation = v("f-filmloc");
  draft.rate = v("f-rate"); draft.notes = v("f-notes");
  const at = $("#f-attn", layer); if (at) draft.attention = at.checked;
  draft.dates = draft.dates.map((e,i) => {
    const dd = $("#dd-"+i, layer); if (!dd) return e;
    const o = {d: dd.value, kind: $("#dk-"+i, layer).value};
    const l = $("#dl-"+i, layer).value.trim(); if (l) o.loc = l;
    const ct = $("#dct-"+i, layer)?.value; if (ct) o.callTime = ct;
    if ($("#dn-"+i, layer).checked) o.night = true;
    const st = $("#dst-"+i, layer).value;
    if (st) o.state = st;
    return o;
  });
}
async function saveDraft(){
  pullForm();
  if (!draft.project){ toast("Add the production name first"); $("#f-project", layer)?.focus(); return; }
  draft.dates = draft.dates.filter(e => /^\d{4}-\d\d-\d\d$/.test(e.d)).sort((a,b)=>a.d.localeCompare(b.d));
  const body = {...draft, review: false, reviewReason: "", updatedAt: new Date().toISOString()};
  if (!draftId) body.createdAt = body.updatedAt;
  const id = draftId || ("c" + Date.now().toString(36) + Math.random().toString(36).slice(2,6));
  try {
    await S.db.collection("calls").doc(id).set(body);
    toast(draftId ? "Saved" : "Added to your schedule");
    closeSheet();
  } catch (e) { writeFailed(e); }
}
async function setStatus(id, st){
  const c = S.calls.get(id); if (!c) return;
  try { await S.db.collection("calls").doc(id).update({status: st, updatedAt: new Date().toISOString()}); toast(`${c.project}: ${SMAP[st].short}`); }
  catch (e) { writeFailed(e); }
}
function writeFailed(e){
  if (e && e.code === "permission-denied"){ toast("This account can't change the schedule"); return; }
  toast("Couldn't save — check your connection and try again");
}

function extract(){
  const text = $("#imp-text", layer).value.trim();
  const subject = $("#imp-subject", layer).value.trim();
  const from = $("#imp-from", layer).value.trim();
  const received = $("#imp-received", layer).value || TODAY;
  const st = $("#imp-status", layer);
  if (!text && !subject){ st.className = "status-line err"; st.textContent = "Paste the email text first."; return; }
  const r = window.EmailParser.parseEmail({subject, fromName: from, fromEmail: "", text, received});
  const call = {...blankCall(), source:"pasted email", received,
    project: r.project, agency: normAgency(r.agency), role: r.role, location: r.location, fitLocation: r.fitLocation,
    filmLocation: r.filmLocation, respondBy: r.respondBy || "", rate: r.rate, notes: r.notes, dates: r.dates,
    rawEmail: ((subject ? subject + "\n\n" : "") + text).slice(0, 8000)};
  const dup = callList().find(c => c.project && call.project && c.project.toLowerCase().replace(/[^a-z0-9]/g,"") === call.project.toLowerCase().replace(/[^a-z0-9]/g,"") && (!call.agency || c.agency === call.agency) && ACTIVE.has(c.status));
  preset_note = r.review ? `${r.reviewReason}. Fill in the gaps from the email below.` : "Check the details, then add it.";
  if (dup) preset_note = `You already have “${dup.project}” from ${dup.agency || "this agency"}. Saving here adds a separate entry — or close this and edit the existing one.`;
  openEditor(null, call);
  preset_note = "";
}

/* ================= files: CSV export, backup, restore ================= */
function saveFile(name, text, type){
  const blob = new Blob([text], {type});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function exportCSV(){
  const rows = [["Project","Agency","Role","Status","Attention","Received","Reply by","Fitting dates","Shoot dates","Night dates","Location","Fitting location","Filming location","Rate","Notes"]];
  for (const c of callList().sort((a,b) => (firstDate(a)||"").localeCompare(firstDate(b)||""))){
    const ds = c.dates||[];
    rows.push([c.project,c.agency,c.role,SMAP[c.status]?.short||c.status,c.attention?"yes":"",c.received||"",c.respondBy||"",
      ds.filter(e=>e.kind==="fit").map(e=>e.d).join(" "), ds.filter(e=>e.kind==="film").map(e=>e.d).join(" "), ds.filter(e=>e.night).map(e=>e.d).join(" "),
      c.location,c.fitLocation,c.filmLocation,c.rate,c.notes]);
  }
  const csv = rows.map(r => r.map(v => `"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
  saveFile(`filming-schedule-${TODAY}.csv`, "﻿" + csv, "text/csv");
}
function exportBackup(){
  const all = {};
  for (const c of callList()){ const {id, ...rest} = c; all[id] = rest; }
  saveFile(`filming-schedule-backup-${TODAY}.json`, JSON.stringify(all), "application/json");
}
function openMenu(){
  layer.innerHTML = `<div class="scrim" data-close></div><aside class="sheet" role="dialog" aria-label="Backup and account">
    <header><h2>Backup &amp; account</h2><button class="btn small ghost" data-close aria-label="Close">✕</button></header>
    <div class="content">
      <div class="fld"><span class="lbl">Download</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-csv>Spreadsheet (CSV)</button><button class="btn" data-backup>Full backup (JSON)</button></div></div>
      <div class="fld"><span class="lbl">Restore or import a backup</span><p style="margin:0;color:var(--muted)">Adds every call in the file. Calls with the same ID are replaced by the file's version.</p><input class="inp" type="file" id="restoreFile" accept=".json,application/json"></div>
      <div class="status-line" id="restoreStatus"></div>
      <div class="fld"><span class="lbl">Signed in as</span><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span>${esc(S.userEmail||"")}</span><button class="btn small" data-signout>Sign out</button></div></div>
    </div>
  </aside>`;
  $("#restoreFile", layer).addEventListener("change", restoreBackup);
}
async function restoreBackup(e){
  const st = $("#restoreStatus", layer);
  const file = e.target.files[0]; if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch { st.className = "status-line err"; st.textContent = "That file isn't a schedule backup."; return; }
  const ids = Object.keys(data || {});
  if (!ids.length){ st.className = "status-line err"; st.textContent = "The file has no calls in it."; return; }
  st.className = "status-line"; st.textContent = `Importing ${ids.length} calls…`;
  try {
    for (let i = 0; i < ids.length; i += 400){               // Firestore takes up to 500 writes at once
      const batch = S.db.batch();
      ids.slice(i, i + 400).forEach(id => batch.set(S.db.collection("calls").doc(id), data[id]));
      await batch.commit();
    }
    st.textContent = `Imported ${ids.length} calls.`;
  } catch (err) { st.className = "status-line err"; st.textContent = "Import failed: " + (err.message || err); }
}

/* ================= events ================= */
document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-open],[data-close]");
  if (!t) return;
  const ds = t.dataset;
  if (ds.tab){ S.tab = ds.tab; save("tab", S.tab); render(); scrollTo(0,0); return; }
  if ("close" in ds){ closeSheet(); return; }
  if (ds.cycle){ const [id, i] = ds.cycle.split("|"); cycleDay(id, +i); return; }
  if (ds.open && !ds.set){ openEditor(ds.open); return; }
  if (ds.day){
    S.cursor = monthStart(parse(ds.day)); S.calView = "agenda"; S.tab = "calendar"; save("calView2","agenda"); render();
    requestAnimationFrame(() => document.getElementById("d-"+ds.day)?.scrollIntoView({block:"center"})); return;
  }
  if (ds.nav !== undefined){ const n = +ds.nav; S.cursor = n === 0 ? monthStart(new Date()) : new Date(S.cursor.getFullYear(), S.cursor.getMonth()+n, 1); render(); return; }
  if (ds.calview){ S.calView = ds.calview; save("calView2", S.calView); render(); return; }
  if (ds.show){ S.show.has(ds.show) ? S.show.delete(ds.show) : S.show.add(ds.show); save("show", [...S.show]); render(); return; }
  if (ds.basis){ S.basis = ds.basis; save("basis", S.basis); render(); return; }
  if (ds.set){ setStatus(ds.id, ds.set); return; }
  if (ds.st && draft){ pullForm(); draft.status = ds.st; drawEditor(); return; }
  if (ds.adddate && draft){ pullForm(); const last = draft.dates[draft.dates.length-1]; draft.dates.push({d: last ? last.d : TODAY, kind: ds.adddate}); drawEditor(); $("#dd-"+(draft.dates.length-1), layer)?.focus(); return; }
  if (ds.showloc !== undefined && draft){ pullForm(); const i = +ds.showloc; openLoc.has(i) ? openLoc.delete(i) : openLoc.add(i); drawEditor(); $("#dl-"+i, layer)?.focus(); return; }
  if (ds.deldate !== undefined && draft){ pullForm(); draft.dates.splice(+ds.deldate, 1); drawEditor(); return; }
  if ("save" in ds){ saveDraft(); return; }
  if ("del" in ds){ pullForm(); confirmDel = true; drawEditor(); return; }
  if ("delno" in ds){ pullForm(); confirmDel = false; drawEditor(); return; }
  if ("delyes" in ds){ S.db.collection("calls").doc(draftId).delete().then(() => { toast("Deleted"); closeSheet(); }, writeFailed); return; }
  if ("extract" in ds){ extract(); return; }
  if ("csv" in ds){ exportCSV(); return; }
  if ("backup" in ds){ exportBackup(); return; }
  if ("signout" in ds){ firebase.auth().signOut(); closeSheet(); return; }
  if ("manual" in ds){ const txt = $("#imp-text", layer)?.value || ""; const rec = $("#imp-received", layer)?.value || TODAY; openEditor(null, {...blankCall(), received: rec, notes: txt.slice(0,600)}); return; }
});

(function boot(){
  const cfg = window.FIREBASE_CONFIG;
  if (!window.firebase || !cfg || !cfg.apiKey || cfg.apiKey.indexOf("PASTE") === 0){
    setSync("err","Not set up");
    main.innerHTML = `<div class="empty"><h2>Almost there</h2><p>Add your Firebase settings to <b>firebase-config.js</b> (see SETUP.md), then reload this page.</p></div>`;
    return;
  }
  firebase.initializeApp(cfg);
  // stay signed in on this device until "Sign out" is pressed
  firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
  const db = firebase.firestore();
  db.enablePersistence({synchronizeTabs: true}).catch(() => {});   // works offline too
  S.db = db;
  let unsub = null;
  firebase.auth().onAuthStateChanged(user => {
    if (unsub){ unsub(); unsub = null; }
    if (!user){ S.loaded = false; S.calls = new Map(); showLogin(); return; }
    S.userEmail = user.email;
    $("#addBtn").hidden = false; $("#exportBtn").hidden = false;
    main.innerHTML = `<div class="empty"><h2>Loading your calls</h2></div>`;
    unsub = db.collection("calls").onSnapshot({includeMetadataChanges: true}, snap => {
      S.calls = new Map(snap.docs.map(d => [d.id, {id: d.id, ...d.data()}]));
      S.loaded = true;
      setSync(snap.metadata.fromCache ? "" : "live", snap.metadata.fromCache ? "Offline copy" : `Live · ${S.calls.size} calls`);
      if (!S.calls.size){
        main.innerHTML = `<div class="empty"><h2>No calls yet</h2><p>Import your backup file from “Backup”, or add your first availability check with “+ Add availability check”.</p></div>`;
        return;
      }
      if (layer.innerHTML && draft) return;           // don't redraw under the editor
      const hadFocus = document.activeElement?.id === "q";
      render();
      if (hadFocus) $("#q")?.focus();
    }, err => {
      setSync("err", "Can't reach the database");
      if (err.code === "permission-denied") {
        const who = firebase.auth().currentUser?.email || "this account";
        firebase.auth().signOut();
        showLogin("You signed in as " + who + ", but that email isn't in the database rules, so the schedule stays locked. Sign in with the other email, or add this one in Firebase → Firestore → Rules.");
      }
    });
  });
})();
})();
</script>
</body>
</html>
