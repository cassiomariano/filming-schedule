<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15181D" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07080A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Filming">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Filming Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a call-sheet board — sticky slate header with tabs, one working surface below (calendar / calls / stats), editor slides in from the right (full screen on phones). Status colours follow the spreadsheet legend. */
:root{
  --bg:#EEF0F2; --surface:#FFFFFF; --surface-2:#F6F7F9; --ink:#15181D; --muted:#5C6370; --faint:#8A919C; --line:#D9DCE2;
  --accent:#2F3BD1; --accent-ink:#FFFFFF; --accent-soft:#E3E5FB;
  --slate:#15181D; --slate-ink:#F4F5F7;
  --st-pending:#FFFFFF; --st-pending-fg:#15181D;
  --st-available:#F6D432; --st-available-fg:#15181D;
  --st-confirmed:#78C043; --st-confirmed-fg:#0E1A06;
  --st-done:#1FA6E0; --st-done-fg:#04161F;
  --st-released:#737985; --st-released-fg:#FFFFFF;
  --st-canceled:#C3C7CE; --st-canceled-fg:#3C424C;
  --st-declined:#3A3E46; --st-declined-fg:#E9EBEE;
  --attn:#E0372B; --night:#4A3DB5; --clash:#E0372B;
  --shadow:0 18px 48px rgba(18,22,30,.18);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101216; --surface:#191C22; --surface-2:#1F232A; --ink:#ECEEF2; --muted:#A0A7B3; --faint:#737B88; --line:#2C3139;
  --accent:#8F96FF; --accent-ink:#0E1030; --accent-soft:#262A55;
  --slate:#07080A; --slate-ink:#F4F5F7;
  --st-pending:#191C22; --st-pending-fg:#ECEEF2;
  --st-available:#E7C62A; --st-available-fg:#15181D;
  --st-confirmed:#6BB23A; --st-confirmed-fg:#0B1505;
  --st-done:#1E98CF; --st-done-fg:#03121A;
  --st-released:#5A606B; --st-released-fg:#F1F2F4;
  --st-canceled:#3A3F48; --st-canceled-fg:#B7BCC5;
  --st-declined:#C9CDD4; --st-declined-fg:#1A1D22;
  --attn:#FF5A4E; --night:#A79DFF; --clash:#FF5A4E;
  --shadow:0 18px 48px rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101216; --surface:#191C22; --surface-2:#1F232A; --ink:#ECEEF2; --muted:#A0A7B3; --faint:#737B88; --line:#2C3139;
  --accent:#8F96FF; --accent-ink:#0E1030; --accent-soft:#262A55;
  --slate:#07080A; --slate-ink:#F4F5F7;
  --st-pending:#191C22; --st-pending-fg:#ECEEF2;
  --st-available:#E7C62A; --st-available-fg:#15181D;
  --st-confirmed:#6BB23A; --st-confirmed-fg:#0B1505;
  --st-done:#1E98CF; --st-done-fg:#03121A;
  --st-released:#5A606B; --st-released-fg:#F1F2F4;
  --st-canceled:#3A3F48; --st-canceled-fg:#B7BCC5;
  --st-declined:#C9CDD4; --st-declined-fg:#1A1D22;
  --attn:#FF5A4E; --night:#A79DFF; --clash:#FF5A4E;
  --shadow:0 18px 48px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
pre.raw{white-space:pre-wrap;font-family:var(--f-mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:320px;overflow:auto;margin:6px 0 0}
.review-note{background:var(--accent-soft);border-radius:8px;padding:8px 10px;font-size:13px}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--slate);color:var(--slate-ink)}
.top-inner{max-width:1240px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.brand-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.clap{width:34px;height:26px;flex:none;border-radius:3px;background:repeating-linear-gradient(-45deg,var(--slate-ink) 0 6px,var(--slate) 6px 12px);border:2px solid var(--slate-ink)}
h1{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.sync{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.75;display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:#7C818A;display:inline-block}
.sync.live i{background:#78C043;box-shadow:0 0 0 3px rgba(120,192,67,.25)}
.sync.err i{background:#E0372B}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{padding:5px 9px;font-size:12px;border-radius:6px}
.btn.danger{color:var(--attn);border-color:color-mix(in srgb,var(--attn) 40%,var(--line))}
.top .btn.ghost{color:var(--slate-ink);border-color:rgba(255,255,255,.25)}
.top .btn.primary{background:#F6D432;color:#15181D;border-color:#F6D432}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;color:var(--slate-ink);opacity:.6;padding:10px 14px 12px;font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;border-bottom:3px solid transparent;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{opacity:1;border-bottom-color:#F6D432}
.count{font-family:var(--f-mono);font-size:11px;background:rgba(255,255,255,.14);border-radius:10px;padding:1px 7px;letter-spacing:0}
.count.hot{background:var(--attn);color:#fff}

main{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}

/* ---------- legend & alerts ---------- */
.legend{display:flex;flex-wrap:wrap;gap:6px 6px;align-items:center}
.legend .lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 10px 4px 6px;font-size:12px;font-weight:600;cursor:pointer;user-select:none}
.fchip[aria-pressed="false"]{opacity:.45}
.fchip[aria-pressed="false"] .sw{filter:grayscale(1)}
.sw{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.15)}
.alerts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.alert{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--attn);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.alert.reply{border-left-color:var(--st-available)}
.alert h3{margin:0;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.alert ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.alert li{display:flex;gap:8px;align-items:baseline;min-width:0}
.alert li button{background:none;border:0;padding:0;cursor:pointer;text-align:left;font-weight:600;min-width:0;max-width:65%;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert li button:hover{text-decoration:underline}
.alert .when{font-family:var(--f-mono);font-size:11px;color:var(--muted);flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert li .when:first-child{flex:none}

/* ---------- toolbar ---------- */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.month-title{font-family:var(--f-display);font-weight:800;font-size:28px;text-transform:uppercase;letter-spacing:.02em;margin:0 6px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
.inp:focus{border-color:var(--accent);outline:none}

/* ---------- month grid ---------- */
.grid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.month{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));min-width:830px}
.dow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.day{min-height:118px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;position:relative;min-width:0}
.day:nth-child(7n){border-right:0}
.day.out{background:var(--surface-2)}
.day.out .dnum{opacity:.4}
.dhead{display:flex;align-items:center;gap:6px}
.dnum{font-family:var(--f-mono);font-size:12px;font-weight:600}
.day.today .dnum{background:var(--ink);color:var(--bg);border-radius:4px;padding:0 5px}
.clash{font-family:var(--f-mono);font-size:10px;font-weight:600;color:#fff;background:var(--clash);border-radius:3px;padding:0 4px;letter-spacing:.04em;text-transform:uppercase}
.ev{display:flex;align-items:center;gap:4px;border-radius:4px;padding:2px 5px;font-size:11.5px;font-weight:600;line-height:1.3;cursor:pointer;border:1px solid transparent;text-align:left;width:100%;min-width:0}
h3.wk{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 0;font-weight:600}
.ups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:10px}
.up{background:var(--surface);border:1px solid var(--line);border-left-width:6px;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.s-pending-edge{border-left-color:var(--faint)}.s-available-edge{border-left-color:var(--st-available)}.s-confirmed-edge{border-left-color:var(--st-confirmed)}
.uphead{cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.uphead h4{margin:0;font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere}
.upst{align-self:flex-start;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:20px;padding:2px 9px}
.upmeta{font-size:12.5px;color:var(--muted)}
.upmeta .ag{color:var(--ink);font-weight:700;font-size:13.5px}   /* the agency, easy to spot */
.uprow{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:start}
.uplab{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.updays{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.upday{font:inherit;font-size:13px;font-weight:600;border:1px solid transparent;border-radius:6px;padding:2px 8px;cursor:pointer;text-align:left}
.upday:hover{outline:2px solid var(--accent);outline-offset:1px}
.upday small{font-weight:400;opacity:.8}
.upday.off{text-decoration:line-through;font-weight:400}
.upday.upclash{border-color:var(--clash);box-shadow:inset 0 0 0 1px var(--clash)}
.upacts{display:flex;gap:6px;flex-wrap:wrap}
details.answers{font-size:12.5px;color:var(--muted)}
details.answers summary{cursor:pointer}
details.answers ul,.anslist{margin:4px 0 0;padding-left:18px;font-size:13px}
.outside{display:inline-block;font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:#fff;background:var(--attn);border-radius:4px;padding:1px 6px;white-space:nowrap}
.maplink{font-size:12px;color:var(--accent);white-space:nowrap}
.muted{color:var(--faint)}
.nextjob{background:var(--st-confirmed);color:var(--st-confirmed-fg);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.nextjob .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.nextjob h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;text-transform:uppercase}
.nextjob .muted{color:inherit;opacity:.7}
.nj-line{font-size:15px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bjobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:14px}
.bjob{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.bjob .bj-head{background:var(--st-confirmed);color:var(--st-confirmed-fg);padding:14px 16px 12px;cursor:pointer}
.bjob.over .bj-head{background:var(--st-done);color:var(--st-done-fg)}
.bj-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.bj-top .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.bj-next{font-size:14px}
.bjob h3{margin:4px 0 2px;font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.05;text-transform:uppercase}
.bjob.first h3{font-size:34px}
.bj-meta{font-size:13px;opacity:.85}
.bjob .soft{opacity:.7}
.bj-place{padding:10px 16px 0;font-size:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bj-place.col{flex-direction:column;align-items:stretch;gap:6px}
.pline{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:baseline}
.plab{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pval{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.w3w{font-size:12.5px;font-weight:700;color:#E11F26;white-space:nowrap;text-decoration:none}
.w3w:hover{text-decoration:underline}
.bj-days{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;padding:12px 16px}
.bday{font:inherit;border:1px solid transparent;border-radius:8px;padding:6px 9px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:1px;min-height:44px}
.bday b{font-size:13.5px}
.bday small{font-size:11.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bday:hover{outline:2px solid var(--accent);outline-offset:1px}
.bday.off b{text-decoration:line-through}
.bday.past{opacity:.65}
.bj-foot{margin-top:auto;display:flex;gap:10px;align-items:center;padding:8px 16px 12px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line)}
.bj-foot span{flex:1}
.btable{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bhead,.brow{display:grid;grid-template-columns:150px 120px minmax(0,1.2fr) minmax(0,1.4fr);gap:12px;padding:10px 14px;align-items:center}
.bhead{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line)}
.brow{border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow.past{opacity:.6}
.bdate{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.bdate small,.bprod small{color:var(--muted);font-size:12px;display:block}
.btime b{font-family:var(--f-display);font-size:24px;font-weight:800}
.btime .muted{font-size:12.5px}
.bprod{cursor:pointer;min-width:0}
.bplace{font-size:13px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}
@media (max-width:760px){.bhead{display:none}.brow{grid-template-columns:auto 1fr;gap:6px 12px}.bprod,.bplace{grid-column:1/-1}}
.dextra{flex:1 1 100%;display:flex;gap:6px;align-items:center}
.dextra .loc{flex:1 1 auto;min-width:0}
.ct{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;color:var(--muted)}
.ct .inp{width:110px}
a.btn{text-decoration:none}
.btn.yes{background:var(--st-confirmed);color:var(--st-confirmed-fg);border-color:var(--st-confirmed)}
.ev .k{font-family:var(--f-mono);font-size:9px;font-weight:600;opacity:.75;flex:none;letter-spacing:.03em}
.ev .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ev .m{flex:none;font-size:11px}
.ev.attn{box-shadow:inset 3px 0 0 var(--attn)}
.ev.x .t{text-decoration:line-through}
.more{background:none;border:0;padding:0 4px;font-size:11px;color:var(--muted);cursor:pointer;text-align:left;font-weight:600}
.s-pending{background:var(--st-pending);color:var(--st-pending-fg);border:1px dashed var(--faint)!important}
.s-available{background:var(--st-available);color:var(--st-available-fg)}
.s-confirmed{background:var(--st-confirmed);color:var(--st-confirmed-fg)}
.s-done{background:var(--st-done);color:var(--st-done-fg)}
.s-released{background:var(--st-released);color:var(--st-released-fg)}
.s-canceled{background:var(--st-canceled);color:var(--st-canceled-fg)}
.s-lapsed{background:var(--st-canceled);color:var(--st-canceled-fg)}
.s-expired{background:var(--st-canceled);color:var(--st-canceled-fg)}
.s-declined{background:var(--st-declined);color:var(--st-declined-fg)}

/* ---------- agenda ---------- */
.agenda{display:flex;flex-direction:column;gap:10px}
.aday{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:start}
.adate{font-family:var(--f-display);text-transform:uppercase;line-height:1;padding-top:4px}
.adate b{display:block;font-size:30px;font-weight:800}
.adate span{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.aday.today .adate b{color:var(--accent)}
.alist{display:flex;flex-direction:column;gap:6px;min-width:0}
.acard{display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px 8px 0;cursor:pointer;text-align:left;width:100%;overflow:hidden;min-width:0}
.acard .bar8{align-self:stretch;border-radius:0}
.acard .main{min-width:0;display:flex;flex-direction:column;gap:1px}
.acard .ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acard .sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kind{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}
.clash-row{font-family:var(--f-mono);font-size:11px;color:var(--clash);font-weight:600;letter-spacing:.04em;text-transform:uppercase}

/* ---------- calls list ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:grid;grid-template-columns:6px minmax(0,1fr) auto;overflow:hidden}
.row .stripe{align-self:stretch}
.stripe.s-pending,.bar8.s-pending{background:var(--faint);border:0!important}
.row .body{padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;cursor:pointer}
.row .line1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}

.kpi .s{font-size:12px;color:var(--muted)}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}

.panel .hint{font-size:12px;color:var(--muted);margin:-6px 0 0}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover+rect,.chart g.col:hover rect.mark{opacity:.8}
.hbars{display:flex;flex-direction:column;gap:6px}
.hb{display:grid;grid-template-columns:minmax(90px,34%) 1fr 64px;gap:8px;align-items:center;font-size:12.5px;min-width:0}

.hb .v{font-family:var(--f-mono);font-size:11px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.keyrow{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.keyrow span{display:inline-flex;gap:6px;align-items:center}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:6px;max-width:240px;box-shadow:var(--shadow)}

/* ---------- sheet (editor) ---------- */

.sheet .content{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.sheet footer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label,.fld .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

      <button type="button" class="health" id="health" data-health hidden><i></i><span></span></button>
      <span class="spacer"></span>

<!-- Firebase (database + sign-in), your settings, and the email reader -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="parser.js"></script>
<script>
(() => {
"use strict";
/* ================= constants ================= */
const STATUSES = [
  {k:"pending",   label:"New – reply needed", short:"New"},
  {k:"available", label:"Available (accepted)", short:"Available"},
  {k:"confirmed", label:"Confirmed booking", short:"Confirmed"},
  {k:"done",      label:"Done / worked", short:"Done"},
  {k:"declined",  label:"Declined", short:"Declined"},
  {k:"expired",   label:"Expired – never answered", short:"Expired"},
  {k:"lapsed",    label:"Not booked – dates passed", short:"Not booked"},
  {k:"released",  label:"Released", short:"Released"},
  {k:"canceled",  label:"Canceled", short:"Canceled"},
];
const SMAP = Object.fromEntries(STATUSES.map(s => [s.k, s]));
/* the name to show for a call: production, else the email subject */
/* old jobs tidy themselves: once every date has passed, a booked job is "worked", an unanswered
   one "expired", and one you said yes to that never got booked "not booked" */
/* tidy() only changes what you SEE – it is never saved (the editor puts the real status back) */
function tidy(c){
  // keep only days with a proper YYYY-MM-DD date; a day with no type is a shoot day
  const dates = (Array.isArray(c.dates) ? c.dates : [])
    .filter(e => e && typeof e.d === "string" && /^\d{4}-\d\d-\d\d$/.test(e.d))
    .map(e => e.kind ? e : {...e, kind: "film"});
  c = {...c, dates};
  // a new request whose reply deadline passed (more than 12 hours ago) can't be answered any more
  if (c.status === "pending" && c.respondBy && new Date(c.respondBy).getTime() < Date.now() - 12 * 3600e3)
    return {...c, status: "expired", tidied: c.status};
  // a new request with no dates and no deadline, older than 3 weeks, is stale
  if (c.status === "pending" && !dates.length && !c.respondBy && (c.received || "") && c.received < addDays(TODAY, -21))
    return {...c, status: "expired", tidied: c.status};
  if (!ACTIVE.has(c.status) || !dates.length) return c;
  // every day released / canceled / said no (and at least one released or canceled): show it as released
  const raw = dates.map(e => dayStatusRaw(c, e));
  if (raw.every(s => s === "released" || s === "canceled" || s === "declined") && raw.some(s => s !== "declined"))
    return {...c, status: "released", tidied: c.status};
  // still has a day ahead that isn't released / canceled: leave it as it is
  if (dates.some((e, i) => e.d >= TODAY && raw[i] !== "released" && raw[i] !== "canceled")) return c;
  const map = {confirmed:"done", pending:"expired", available:"lapsed"};
  return map[c.status] ? {...c, status: map[c.status], tidied: c.status} : c;
}
function nameOf(c){ return (c.project || "").trim() || (c.emailSubject || "").trim() || "No production name – open to add"; }
/* what each status means, in plain words, for the Upcoming cards */

/* ================= date helpers (dates are local YYYY-MM-DD strings) ================= */
const pad = n => String(n).padStart(2,"0");
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
function monthStart(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function weekStart(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; }
let TODAY = key(new Date());             // updated in render(), so it never goes stale overnight
/* a date n days before/after k, counted on the calendar (safe across clock changes) */
function addDays(k, n){ const d = parse(k); d.setDate(d.getDate() + n); return key(d); }
const fmtDay = k => { const d = parse(k); return `${DOW[(d.getDay()+6)%7]} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}${d.getFullYear() !== new Date().getFullYear() ? " "+String(d.getFullYear()).slice(2) : ""}`; };
const fmtShort = fmtDay;                 // same thing: adds the year when it isn't this year
const fmtDM = k => { const d = parse(k); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}${d.getFullYear() !== new Date().getFullYear() ? " "+String(d.getFullYear()).slice(2) : ""}`; };
function dueText(iso){
  if (!iso) return "";
  const t = new Date(iso.length <= 10 ? iso+"T23:59" : iso);
  const h = (t - new Date())/36e5;
  if (h < 0) return {txt:"Reply deadline passed", late:true};
  if (h < 24) return {txt:`Reply within ${Math.max(1,Math.round(h))}h`, late:true};
  return {txt:`Reply by ${DOW[(t.getDay()+6)%7]} ${t.getDate()} ${MONTHS[t.getMonth()].slice(0,3)} ${pad(t.getHours())}:${pad(t.getMinutes())}`, late:h<48};
}

const AGENCY_ALIASES = {extrapeople:"Extra People",two10:"Two 10 Casting",two10casting:"Two 10 Casting",castingcollective:"Casting Collective",keycasting:"Key Casting",universalextras:"Universal Extras",lucasextras:"Lucas Extras",cameraactionextras:"Camera Action Extras",cameraaction:"Camera Action Extras",wilkins:"Wilkins Casting",wilkinscasting:"Wilkins Casting",wilkinscastingltd:"Wilkins Casting",sabellcasting:"Sabell Casting",sabell:"Sabell Casting",bbbtalent:"BBB Talent",bbb:"BBB Talent",bbbtalentagency:"BBB Talent",bbbtalentteam:"BBB Talent",onsetextras:"On Set Extras",onset:"On Set Extras",trueedge:"True Edge",castingcollectiveltd:"Casting Collective"};
function normAgency(a){ const s = (a||"").trim(); const k = s.toLowerCase().replace(/[^a-z0-9]/g,""); return AGENCY_ALIASES[k] || s; }

/* the status of ONE day: a single day can be released, canceled or worked
   even when the rest of the booking is still on */
const DAY_STATES = [["", "Same as the call"], ["pending", "New (not answered)"], ["available", "Available (on hold)"], ["worked", "Worked"], ["released", "Released"], ["canceled", "Canceled"]];
function dayStatus(c, e){
  const st = dayStatusRaw(c, e);
  if (e.d < TODAY){                                    // the day has passed
    if (st === "confirmed") return "done";             // booked and gone: worked (tap to change)
    if (st === "pending") return "expired";
    if (st === "available") return "lapsed";
  }
  return st;
}
function dayStatusRaw(c, e){
  if (e.state === "released") return "released";
  if (e.state === "canceled") return "canceled";
  if (e.state === "available") return "available";       // production kept this day "available / on hold"
  if (e.state === "pending") return "pending";           // a day added by a later email, not answered yet
  if (e.state === "worked" || e.done) return "done";
  // what you ticked for this day on the agency page
  if (e.answer === "no" && c.status !== "done") return "declined";   // you said no to this day
  if (e.answer === "yes" && c.status === "pending") return "available";
  return c.status;
}

/* tap a day: automatic → available, on hold (yellow) → done (blue) → canceled (grey) → automatic */
const CYCLE = ["", "available", "worked", "canceled"];
const CYCLE_PAST = ["", "worked", "canceled", "released"];
const CYCLE_WORDS = {"": "back to automatic colour", available: "available / on hold (yellow)", worked: "done ✓ (blue)", canceled: "canceled (grey)", released: "released (grey)"};
async function cycleDay(id, i){
  const c = S.calls.get(id); if (!c || !c.dates || !c.dates[i]) return;
  const dates = c.dates.map(e => ({...e}));
  const e = dates[i];
  const now = e.state || (e.done ? "worked" : "");
  const cyc = e.d < TODAY ? CYCLE_PAST : CYCLE;          // a past day: worked / canceled / released
  // skip states that would look the same colour, so every tap visibly changes the day
  const colour = st => ({lapsed:"canceled", expired:"canceled"}[st] || st);
  const looks = state => { const t = {...e}; delete t.done; if (state) t.state = state; else delete t.state; return colour(dayStatus(c, t)); };
  const nowLooks = colour(dayStatus(c, e));
  const start = Math.max(0, cyc.indexOf(now));
  let next = cyc[(start + 1) % cyc.length];
  for (let step = 1; step < cyc.length; step++){
    const cand = cyc[(start + step) % cyc.length];
    if (looks(cand) !== nowLooks){ next = cand; break; }
  }
  delete e.done;
  if (next) e.state = next; else delete e.state;
  try {
    await S.db.collection("calls").doc(id).update({dates, updatedAt: new Date().toISOString()});
    toast(`${nameOf(c)} · ${fmtShort(e.d)}: ${CYCLE_WORDS[next]}`);
  } catch (err) { writeFailed(err); }
}
const DAY_TIP = "Tap: available (yellow) → done (blue) → canceled (grey) → automatic";

/* entries per day for the calendar */
function dayIndex(){
  const m = new Map();
  for (const c of S.calls.values()){
    for (const e of (c.dates||[])){
      if (!m.has(e.d)) m.set(e.d, []);
      m.get(e.d).push({c, e});
    }
  }
  for (const arr of m.values()) arr.sort((a,b) => prio(dayStatus(a.c,a.e))-prio(dayStatus(b.c,b.e)) || (a.c.project||"").localeCompare(b.c.project||""));
  return m;
}
function clashes(idx){
  const out = new Map();
  for (const [d, arr] of idx){
    const act = arr.filter(x => ACTIVE.has(dayStatus(x.c, x.e)));
    const ids = new Set(act.map(x => x.c.id));
    if (ids.size >= 2 && act.some(x => dayStatus(x.c, x.e) === "confirmed")) out.set(d, act);
  }
  return out;
}

const main = $("#main");
/* re-tidy every call from the raw database copy (needed when the day changes) */
function retidy(){ S.calls = new Map([...(S.raw || new Map())].map(([id, d]) => [id, tidy({id, ...d})])); }
function render(){
  const t = key(new Date());
  if (t !== TODAY){ TODAY = t; retidy(); }              // midnight passed while the app was open
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === S.tab)));

function alertsHTML(idx){
  const pend = callList().filter(c => c.status === "pending").sort((a,b) => (a.respondBy||"9").localeCompare(b.respondBy||"9"));
  const cl = [...clashes(idx)].filter(([d]) => d >= TODAY).sort((a,b) => a[0].localeCompare(b[0]));
  // "check details" only for live jobs (still open, with days ahead or no dates yet, from the last 3 weeks)
  const live = c => ACTIVE.has(c.status) && (!(c.dates||[]).length || (c.dates||[]).some(e => e.d >= TODAY)) && (!c.received || c.received >= addDays(TODAY, -21));
  const rev = callList().filter(c => c.review && live(c)).sort((a,b) => (b.received||"").localeCompare(a.received||""));
  if (!pend.length && !cl.length && !rev.length) return "";

  if (rev.length) h += `<section class="alert" style="border-left-color:var(--accent)"><h3>From your email · check details · ${rev.length}</h3><ul>${rev.slice(0,6).map(c =>

  if (cl.length) h += `<section class="alert"><h3>Booking clashes ahead · ${cl.length}</h3><ul>${cl.slice(0,6).map(([d,arr]) =>

/* day types: shoot, fitting, rehearsal */
const KIND = {film:["Shoot","SHOOT","S"], fit:["Fitting","FIT","F"], reh:["Rehearsal","REH","R"]};
const kindName = k => (KIND[k] || KIND.film)[0];

const kindLetter = k => (KIND[k] || KIND.film)[2];

/* where you go on a given day: call-time place, else the day's place, else the call's */
function placeOf(c, e){ return e.callPlace || e.loc || (e.kind==="fit" ? c.fitLocation : c.filmLocation) || c.location || ""; }
function outsideBadge(place){

/* what3words: the exact 3-metre square from the call sheet (opens the what3words app or website) */

/* the exact place for a kind of day (fitting / filming): from the next day of that kind that has one */
function exactPlace(c, days, kinds){
  const list = days.filter(x => kinds.includes(x.e.kind || "film"));

function mapLink(place){ return place ? `<a class="maplink" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place)}" target="_blank" rel="noopener">Map ↗</a>` : ""; }

/* every booked day (green), soonest first */
function bookedDays(includePast){
  const out = [];
  for (const c of S.calls.values()) for (const e of (c.dates||[])){
    const st = dayStatus(c, e);
    if (st === "confirmed" || (includePast && st === "done")) if (includePast || e.d >= TODAY) out.push({c, e});
  }
  return out.sort((a,b) => a.e.d.localeCompare(b.e.d) || (a.e.callTime||"99").localeCompare(b.e.callTime||"99"));
}
function daysAway(d){
  const n = Math.round((parse(d) - parse(TODAY)) / 864e5);
  return n === 0 ? "Today" : n === 1 ? "Tomorrow" : n > 1 ? `in ${n} days` : `${-n} days ago`;
}

/* The Booked tab: one green card per booked job. Every day is a chip — tap it to mark
   done (blue) → canceled (grey) → back to booked. Tap the title for all the details. */
function bookedJobs(includePast){
  const jobs = [];
  for (const c of S.calls.values()){
    const days = (c.dates||[]).map((e,i) => ({e, i, st: dayStatus(c, e)})).sort((a,b) => a.e.d.localeCompare(b.e.d));
    const live = days.filter(x => x.st === "confirmed");
    // days still to come that are still on (booked, on hold or new) – released/canceled days don't count
    const ahead = days.filter(x => x.e.d >= TODAY && ACTIVE.has(x.st));
    // a finished booked job shows as "done", so count it when past days are shown
    const booked = c.status === "confirmed" || live.length || (includePast && c.status === "done");
    if (!booked) continue;
    if (!ahead.length && !(includePast && days.some(x => x.st === "confirmed" || x.st === "done"))) continue;
    jobs.push({c, days, ahead, next: ahead[0] ? ahead[0].e.d : "9999"});
  }
  return jobs.sort((a,b) => a.next.localeCompare(b.next) || nameOf(a.c).localeCompare(nameOf(b.c)));
}
function mainPlace(c, days){
  const count = {};
  days.forEach(x => { const p = placeOf(c, x.e); if (p) count[p] = (count[p]||0) + 1; });
  return Object.entries(count).sort((a,b) => b[1]-a[1])[0]?.[0] || c.location || "";
}

      </header>
      ${(() => {
        // once booked: the exact place for fittings and for filming (call sheet / booking email)
        const ahead = shown.filter(x => x.e.d >= TODAY && x.st !== "released" && x.st !== "canceled");
        const pool = ahead.length ? ahead : shown;
        const fit = exactPlace(c, pool, ["fit"]), film = exactPlace(c, pool, ["film", "reh"]);
        const lines = placeLineHTML("Fitting", fit) + placeLineHTML("Filming", film);
        return lines ? `<div class="bj-place col">${lines}</div>` : `<div class="bj-place">${place ? `📍 ${esc(place)} ${mapLink(place)} ${outsideBadge(place)}` : `<span class="soft">📍 exact place not in yet – it comes with the call sheet</span>`}</div>`;
      })()}
      <div class="bj-days">${shown.map(x => {
        const e = x.e, st = x.st, off = st === "released" || st === "canceled";
        const pl = placeOf(c, e);
        const sub = [e.kind !== "film" ? kindName(e.kind) : "", st === "available" ? "on hold" : "", e.callTime ? "call " + e.callTime : (st === "confirmed" ? "call tbc" : ""), pl && pl !== place ? pl : "", off ? st : "", st === "done" ? "worked ✓" : ""].filter(Boolean).join(" · ");
        return `<button type="button" class="bday ${clsS(st)}${off?" off":""}${e.d < TODAY ? " past" : ""}" data-cycle="${c.id}|${x.i}" title="${DAY_TIP}"><b>${fmtShort(e.d)}${e.night?" ☾":""}</b><small>${esc(sub || " ")}</small></button>`;
      }).join("")}</div>
      <footer class="bj-foot"><span>${j.ahead.length} day${j.ahead.length===1?"":"s"} ahead${worked?` · ${worked} worked`:""}</span>${c.emailSubject?`<a class="maplink" href="https://mail.yahoo.com/d/search/keyword=${encodeURIComponent(c.emailSubject)}" target="_blank" rel="noopener">✉ Email ↗</a>`:""}<button class="btn small ghost" data-open="${c.id}">Details</button></footer>
    </article>`;
  });
  main.innerHTML = h + `</div>`;
}

/* Reply buttons: the agency's own links (opened in a new tab) + one tap to record your answer.
   Yes/No links (e.g. True Edge) record your answer as you tap them. */
function replyHTML(c){
  const links = c.links || [];
  const yes = links.find(l => l.kind === "yes"), no = links.find(l => l.kind === "no"), respond = links.find(l => l.kind === "respond");
  let h = "";
  if (c.status === "pending"){
    if (yes) h += `<a class="btn small yes" href="${esc(yes.url)}" target="_blank" rel="noopener" data-quick="available" data-id="${c.id}">✓ Yes, available ↗</a>`;
    if (no)  h += `<a class="btn small" href="${esc(no.url)}" target="_blank" rel="noopener" data-quick="declined" data-id="${c.id}">✕ Not available ↗</a>`;
    if (respond && !(yes && no)) h += `<a class="btn small primary" href="${esc(respond.url)}" target="_blank" rel="noopener">Reply to agency ↗</a>`;
    // agency Yes/No links already record your answer; otherwise one tap to note what you said
    if (!(yes && no)) h += `<button class="btn small" data-set="available" data-id="${c.id}">✓ ${respond?"I said yes":"Accept"}</button><button class="btn small" data-set="declined" data-id="${c.id}">✕ ${respond?"I said no":"Decline"}</button>`;
  } else if (c.status === "available"){
    h += `<button class="btn small" data-set="confirmed" data-id="${c.id}">I'm booked</button><button class="btn small" data-set="released" data-id="${c.id}">Released</button>`;
  }
  if (c.emailSubject) h += `<a class="btn small ghost" href="https://mail.yahoo.com/d/search/keyword=${encodeURIComponent(c.emailSubject)}" target="_blank" rel="noopener" title="Search Yahoo Mail for this email">✉ Email ↗</a>`;
  return h;
}

/* Upcoming: one card per job — name, your status, fitting days, shoot days */
function upcomingHTML(cl){
  const active = ["pending","available","confirmed"];
  const jobs = callList()
    .filter(c => active.includes(c.status) && daysAhead(c).length)     // only days that are still on
    .sort((a,b) => nextDate(a).localeCompare(nextDate(b)));
  let h = `<div class="bar"><h2 class="month-title" style="margin:0">Upcoming</h2><span class="src">${jobs.length} jobs with dates ahead</span><span style="flex:1"></span>
    <div class="seg" role="group" aria-label="Calendar view"><button data-calview="upcoming" aria-pressed="true">Upcoming</button><button data-calview="month" aria-pressed="false">Month</button><button data-calview="agenda" aria-pressed="false">Agenda</button></div></div>`;
  if (!jobs.length) h += `<div class="empty"><h2>Nothing coming up</h2><p>New availability checks appear here as soon as they arrive.</p></div>`;
  // Booked jobs first (green), then "said available, waiting to hear" (yellow), then new ones
  const sections = [
    ["confirmed", "Booked – your next jobs", "Production has booked you."],
    ["available", "Waiting to hear", "You said you're available; production hasn't confirmed yet."],
    ["pending", "New – reply needed", "Accept or decline these."],
  ];
  h += `<div class="keyrow"><span><i class="sw s-confirmed"></i>Booked</span><span><i class="sw s-available"></i>Available – waiting to hear</span><span><i class="sw s-pending"></i>New</span><span><i class="sw s-done"></i>Done (worked)</span><span><i class="sw s-canceled"></i>Canceled / released / said no</span><span>· Tap a day: yellow → blue → grey → back</span></div>`;
  // Just in: new or available requests from the last 3 days, and ones a later email changed.
  // Booked jobs stay in "Booked" (with their "Updated" badge).
  const recent = addDays(TODAY, -3);
  const justIn = callList().filter(c => (c.status === "pending" || c.status === "available") &&
      ((c.received || "") >= recent || c.newInfo) && (!(c.dates||[]).length || daysAhead(c).length))
    .sort((a,b) => (b.received||"").localeCompare(a.received||""));
  const inJust = new Set(justIn.map(c => c.id));
  // no dates yet (and not already shown in "Just in")
  const undated = callList().filter(c => active.includes(c.status) && !(c.dates||[]).length && !inJust.has(c.id));
  if (justIn.length) h += `<section class="justin"><h3 class="wk">Just in · ${justIn.length}</h3><p class="src" style="margin:-6px 0 0">New availability checks from the last 3 days, and jobs a later email changed.</p><div class="ups">${justIn.map(c => upCard(c, cl, true)).join("")}</div></section>`;
  for (const [st, title, sub] of sections){
    const list = jobs.filter(c => c.status === st && !inJust.has(c.id));
    if (!list.length) continue;
    h += `<h3 class="wk">${title} · ${list.length}</h3><p class="src" style="margin:-6px 0 0">${sub}</p><div class="ups">${list.map(c => upCard(c, cl)).join("")}</div>`;
  }
  if (undated.length) h += `<h3 class="wk">No dates yet</h3><div class="ups">${undated.map(c => upCard(c, cl)).join("")}</div>`;
  return h;
}
function upCard(c, cl, fresh){
  const days = (c.dates||[]).slice().sort((a,b)=>a.d.localeCompare(b.d));
  const line = kind => {
    // the shoot line also takes days of any unknown type, so no day goes missing
    const list = days.filter(e => kind === "film" ? (e.kind === "film" || !KIND[e.kind]) : e.kind === kind);
    if (!list.length) return "";
    return `<div class="uprow"><span class="uplab">${kindName(kind)}</span><span class="updays">${list.map(e => {
      const st = dayStatus(c,e); const off = st==="released"||st==="canceled"||st==="declined";
      const where = placeOf(c, e);
      const said = e.answer === "no" ? " <small>✕ you said no</small>" : e.answer === "yes" && !off ? " <small>✓ you said yes</small>" : "";
      return `<button type="button" class="upday ${clsS(st)}${off?" off":""}${cl.has(e.d)&&!off?" upclash":""}" data-cycle="${c.id}|${c.dates.indexOf(e)}" title="${esc(SMAP[st]?.label||"")}${cl.has(e.d)?" · clash with another call":""} · ${DAY_TIP}">${fmtShort(e.d)}${e.night?" ☾":""}${e.callTime?` <small>· call ${esc(e.callTime)}</small>`:""}${where?` <small>@ ${esc(where)}</small>`:""}${off && e.answer !== "no" ? ` <small>(${st})</small>` : ""}${said}${st==="done"?" ✓ worked":""}</button>`;
    }).join("")}</span></div>`;
  };
  const du = c.status === "pending" ? dueText(c.respondBy) : null;
  const acts = replyHTML(c);
  const got = c.received ? (c.received === TODAY ? "today" : c.received === addDays(TODAY, -1) ? "yesterday" : fmtDay(c.received)) : "";
  return `<article class="up ${clsS(c.status)}-edge${fresh ? " fresh" : ""}">
    ${fresh ? `<div class="freshline">${c.newInfo ? "● " + esc(c.newInfoText || "Updated by a later email") : "● New availability check"}${got ? " · received " + got : ""}</div>` : ""}
    <div class="uphead" data-open="${c.id}" role="button" tabindex="0">
      <span class="upst ${clsS(c.status)}">${esc(MEANS[c.status]||c.status)}</span>
      <h4>${esc(nameOf(c))}</h4>
      <div class="upmeta">${outsideBadge(c.location || c.filmLocation || c.fitLocation || (c.dates||[]).map(e=>e.loc).find(Boolean) || "")} ${c.agency ? `<b class="ag">${esc(c.agency)}</b>` : ""}${c.agency && c.role ? " · " : ""}${esc(c.role || "")}${du?` · <b class="due${du.late?" late":""}">${esc(du.txt)}</b>`:""}${c.review?` · <b style="color:var(--accent)">check details</b>`:""}${c.newInfo?` <span class="newinfo" title="${esc(c.newInfoText||"")}">● Updated</span>`:""}</div>
    </div>
    ${line("fit")}${line("reh")}${line("film")}
    ${(c.answers||[]).length ? `<details class="answers"><summary>Your answers on the agency page</summary><ul>${c.answers.map(a => `<li>${esc(a)}</li>`).join("")}</ul></details>` : ""}
    ${acts?`<div class="upacts">${acts}</div>`:""}
  </article>`;
}

function renderCalls(){
  const agencies = [...new Set(callList().map(c => c.agency).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  let list = callList();
  const groups = {review:"review", open:["pending","available","confirmed"], pending:["pending"], available:["available"], confirmed:["confirmed"], done:["done"], declined:["declined"], closed:["released","canceled","expired","lapsed"], all:null};
  const g = groups[S.listStatus];
  if (g === "review") list = list.filter(c => c.review);
  else if (g) list = list.filter(c => g.includes(c.status));
  if (S.agency) list = list.filter(c => c.agency === S.agency);
  if (S.q){ const q = S.q.toLowerCase(); list = list.filter(c => [c.project,c.agency,c.role,c.location,c.notes,c.fitLocation,c.filmLocation].join(" ").toLowerCase().includes(q)); }
  const sorters = {
    next: (a,b) => (nextDate(a)||"9999").localeCompare(nextDate(b)||"9999") || (lastDate(b)||"").localeCompare(lastDate(a)||""),
    received: (a,b) => (b.received||firstDate(b)||"").localeCompare(a.received||firstDate(a)||""),
    reply: (a,b) => (a.respondBy||"9999").localeCompare(b.respondBy||"9999"),
    project: (a,b) => (a.project||"").localeCompare(b.project||""),
  };
  const rank = {confirmed:0, available:1, pending:2};
  if (S.listStatus === "open") list.sort((a,b) => (rank[a.status]??3)-(rank[b.status]??3) || sorters[S.sort](a,b));
  else list.sort(sorters[S.sort]);
  let h = `<div class="bar">
    <input class="inp" id="q" type="search" placeholder="Search project, role, place…" value="${esc(S.q)}" style="flex:1 1 220px">
    <select class="inp" id="statusSel" aria-label="Status">${[["open","Open (new, available, confirmed)"],["review","From email – to check"],["pending","New – reply needed"],["available","Available"],["confirmed","Confirmed"],["done","Done"],["declined","Declined"],["closed","Released / canceled / expired / not booked"],["all","All calls"]].map(([v,l]) => `<option value="${v}"${S.listStatus===v?" selected":""}>${l}</option>`).join("")}</select>
    <select class="inp" id="agencySel" aria-label="Agency"><option value="">All agencies</option>${agencies.map(a => `<option${S.agency===a?" selected":""}>${esc(a)}</option>`).join("")}</select>
    <select class="inp" id="sortSel" aria-label="Sort">${[["next","Next date"],["received","Newest received"],["reply","Reply deadline"],["project","Project A–Z"]].map(([v,l]) => `<option value="${v}"${S.sort===v?" selected":""}>Sort: ${l}</option>`).join("")}</select>
  </div><div class="src">${list.length} of ${S.calls.size} calls</div><div class="keyrow"><span><i class="sw s-confirmed"></i>Booked</span><span><i class="sw s-available"></i>Available – waiting to hear</span><span><i class="sw s-pending"></i>New</span><span><i class="sw s-done"></i>Done (worked)</span><span><i class="sw s-canceled"></i>Canceled / released</span><span>· Tap a day: yellow → blue → grey → back</span></div><div class="list">`;
  if (!list.length) h += `<div class="empty"><h2>No calls here</h2><p>Try another status or agency, or add a new availability check.</p></div>`;
  for (const c of list){
    const du = c.status === "pending" ? dueText(c.respondBy) : null;
    const ds = (c.dates||[]).slice().sort((a,b)=>a.d.localeCompare(b.d));
    const shown = ds.slice(0, 40);
    h += `<article class="row"><span class="stripe ${clsS(c.status)}"></span>
      <div class="body" data-open="${c.id}" role="button" tabindex="0">
        <div class="line1"><span class="proj">${esc(nameOf(c))}</span><span class="pill ${clsS(c.status)}">${esc(SMAP[c.status]?.short||c.status)}</span>${c.attention?`<span class="flag">● Attention</span>`:""}${c.newInfo?`<span class="newinfo" title="${esc(c.newInfoText||"")}">● Updated${c.newInfoText?" – "+esc(c.newInfoText):""}</span>`:""}</div>
        <div class="meta">${c.agency?`<span><b>${esc(c.agency)}</b></span>`:""}${c.role?`<span>${esc(c.role)}</span>`:""}${(c.location||c.filmLocation)?`<span>📍 ${esc(c.location||c.filmLocation)}</span>`:""}${c.received?`<span>Received ${fmtDay(c.received)}</span>`:""}</div>
        ${shown.length?`<div class="dates">${shown.map(e => { const st = dayStatus(c,e); const off = st==="released"||st==="canceled"||st==="declined"; return `<button type="button" class="dchip ${clsS(st)} ${e.kind}${off?" off":""}" data-cycle="${c.id}|${c.dates.indexOf(e)}" title="${kindName(e.kind)} · ${esc(SMAP[st]?.short || st)} · ${DAY_TIP}">${e.kind!=="film"?kindLetter(e.kind)+" ":""}${fmtDay(e.d)}${e.night?" ☾":""}${st==="done"?" ✓":""}${e.answer==="no"?" ✕":""}</button>`; }).join("")}${ds.length>shown.length?`<span class="dchip">+${ds.length-shown.length}</span>`:""}</div>`:""}
        ${du?`<span class="due${du.late?" late":""}">${esc(du.txt)}</span>`:""}
      </div>
      <div class="acts">${replyHTML(c)}${c.status==="confirmed" && lastDate(c) && lastDate(c) < TODAY ? `<button class="btn small" data-set="done" data-id="${c.id}">Mark done</button>` : ""}</div>
    </article>`;
  }
  main.innerHTML = h + `</div>`;
  const q = $("#q");
  q.addEventListener("input", () => { S.q = q.value; const pos = q.selectionStart; renderCalls(); const n = $("#q"); n.focus(); n.setSelectionRange(pos,pos); });
}

/* ---------- stats ---------- */
const OUT = [
  {k:"booked",  label:"Booked / worked", st:["confirmed","done"], color:"var(--st-confirmed)"},
  {k:"yes",     label:"Accepted, not booked", st:["available","released","canceled","lapsed"], color:"var(--st-available)"},
  {k:"no",      label:"Declined", st:["declined"], color:"var(--st-declined)"},
  {k:"new",     label:"No reply", st:["pending","expired"], color:"var(--faint)"},
];
function outcome(c){ return OUT.find(o => o.st.includes(c.status)) || OUT[3]; }
function basisDate(c){ return S.basis === "received" ? (c.received || firstDate(c)) : firstDate(c); }

/* one year's numbers (calls counted by the chosen date; days counted by their own date) */
function yearStats(all, y){
  const inY = all.filter(c => (basisDate(c) || "").slice(0, 4) === y);
  const answered = inY.filter(c => c.status !== "pending" && c.status !== "expired");
  const declined = answered.filter(c => c.status === "declined").length;
  const days = {fit: 0, reh: 0, film: 0}, ahead = {fit: 0, reh: 0, film: 0};
  const bookedJobs = new Set();
  all.forEach(c => (c.dates || []).forEach(e => {
    if (e.d.slice(0, 4) !== y) return;
    const st = dayStatus(c, e), k = KIND[e.kind] ? e.kind : "film";
    if (st === "done") { days[k]++; bookedJobs.add(c.id); }
    else if (st === "confirmed" && e.d >= TODAY) { ahead[k]++; bookedJobs.add(c.id); }
  }));
  const agencies = group(inY, c => c.agency || "Unknown");          // most calls first
  const earned = moneyJobs().reduce((n, j) => n + earnedBetween(j, y + "-01-01", y + "-12-31"), 0);
  return { calls: inY.length, accepted: answered.length - declined, declined, noReply: inY.length - answered.length,
           booked: bookedJobs.size, days, ahead, worked: days.fit + days.reh + days.film,
           topAgency: agencies[0] ? `${agencies[0].name} (${agencies[0].total})` : "–", earned };
}
function renderStats(){
  const all = callList();
  const now = new Date();
  const wk = key(weekStart(now)), mo = key(monthStart(now));
  const nextWk = addDays(wk, 7), nextMo = key(new Date(now.getFullYear(), now.getMonth()+1, 1));   // upper limits, so future jobs don't count
  const lastMo = key(new Date(now.getFullYear(), now.getMonth()-1, 1));
  const withD = all.filter(c => basisDate(c));
  const thisWeek = withD.filter(c => basisDate(c) >= wk && basisDate(c) < nextWk).length;
  const thisMonth = withD.filter(c => basisDate(c) >= mo && basisDate(c) < nextMo).length;
  const lastMonth = withD.filter(c => basisDate(c) >= lastMo && basisDate(c) < mo).length;
  const fallback = all.filter(c => !c.received).length;
  // the year chosen at the top ("All years" or one year)
  const years = [...new Set(withD.map(c => basisDate(c).slice(0, 4)).concat(all.flatMap(c => (c.dates||[]).map(e => e.d.slice(0, 4)))))].filter(y => /^\d{4}$/.test(y)).sort().reverse();
  const thisYear = String(now.getFullYear());
  if (!S.statYear || (S.statYear !== "all" && !years.includes(S.statYear))) S.statYear = years.includes(thisYear) ? thisYear : "all";
  const Y = S.statYear;
  const ys = Y === "all" ? null : yearStats(all, Y);
  const answered = all.filter(c => c.status !== "pending" && c.status !== "expired" && (Y === "all" || (basisDate(c)||"").slice(0,4) === Y));
  const yes = answered.filter(c => c.status !== "declined").length;
  const bookedAll = all.filter(c => c.status === "confirmed" || c.status === "done").length;
  // same point last year, to compare "so far"
  const ytd = (y, until) => withD.filter(c => basisDate(c) >= y + "-01-01" && basisDate(c) <= until).length;
  const sofar = ytd(thisYear, TODAY), lastSofar = ytd(String(now.getFullYear()-1), (now.getFullYear()-1) + TODAY.slice(4));
  const diff = lastSofar ? Math.round((sofar - lastSofar) / lastSofar * 100) : null;
  const scope = list => Y === "all" ? list : list.filter(c => (basisDate(c)||"").slice(0,4) === Y);

  let h = `<div class="bar"><div class="seg" role="group" aria-label="Count calls by"><button data-basis="received" aria-pressed="${S.basis==="received"}">By date received</button><button data-basis="work" aria-pressed="${S.basis==="work"}">By first work date</button></div>
    <div class="seg" role="group" aria-label="Year">${["all", ...years].map(y => `<button data-statyear="${y}" aria-pressed="${Y===y}">${y==="all"?"All years":y}</button>`).join("")}</div>
    <span class="src">${S.basis==="received" && fallback ? `${fallback} older calls (from your spreadsheet) have no received date, so they count on their first work date.` : ""}</span></div>
  <div class="kpis">
    <div class="kpi"><span class="l">This week</span><span class="n">${thisWeek}</span><span class="s">calls ${fmtDay(wk)} – ${fmtDay(addDays(wk, 6))}</span></div>
    <div class="kpi"><span class="l">${MONTHS[now.getMonth()]} so far</span><span class="n">${thisMonth}</span><span class="s">calls · ${MONTHS[(now.getMonth()+11)%12]}: ${lastMonth}</span></div>
    <div class="kpi"><span class="l">${thisYear} so far</span><span class="n">${sofar}</span><span class="s">calls${diff === null ? "" : ` · ${diff >= 0 ? "+" : ""}${diff}% on ${now.getFullYear()-1} at this point`}</span></div>
    <div class="kpi"><span class="l">Accept rate${Y==="all"?"":" "+Y}</span><span class="n">${answered.length ? Math.round(yes/answered.length*100) : 0}%</span><span class="s">${yes} said yes · ${answered.length-yes} said no</span></div>
    ${ys ? `<div class="kpi"><span class="l">Days on set ${Y}</span><span class="n">${ys.worked}</span><span class="s">worked${Y===thisYear ? ` · ${ys.ahead.fit + ys.ahead.reh + ys.ahead.film} more booked ahead` : ""}</span></div>
    <div class="kpi"><span class="l">Earned ${Y}</span><span class="n">${money(ys.earned)}</span><span class="s">from the Money tab (rates you've added)</span></div>`
         : `<div class="kpi"><span class="l">Booked</span><span class="n">${bookedAll}</span><span class="s">jobs confirmed or worked, all time</span></div>`}
  </div>
  <section class="panel yearly"><h2>Year by year</h2><p class="hint">Calls by ${S.basis==="received"?"date received":"first work date"}; days by the day itself. Earned uses the rates in the Money tab.</p>
    <div class="ytable"><div class="yrow yhead"><span>Year</span><span>Calls</span><span>Yes</span><span>No</span><span>No reply</span><span>Jobs booked</span><span>Days worked</span><span>Fit · Reh · Shoot</span><span>Top agency</span><span>Earned</span></div>
    ${years.map(y => { const t = yearStats(all, y); return `<button type="button" class="yrow${y===Y?" on":""}" data-statyear="${y}"><span><b>${y}</b></span><span>${t.calls}</span><span>${t.accepted}</span><span>${t.declined}</span><span>${t.noReply}</span><span>${t.booked}</span><span>${t.worked}${y===thisYear && (t.ahead.fit+t.ahead.reh+t.ahead.film) ? ` <small>+${t.ahead.fit+t.ahead.reh+t.ahead.film} ahead</small>` : ""}</span><span>${t.days.fit} · ${t.days.reh} · ${t.days.film}</span><span class="ag">${esc(t.topAgency)}</span><span>${money(t.earned)}</span></button>`; }).join("")}
    </div></section>
  <div class="panels">
    <section class="panel"><h2>Calls per week</h2><p class="hint">Last 16 weeks, by ${S.basis==="received"?"date received":"first work date"}.</p>${weekChart(withD)}</section>
    <section class="panel"><h2>Calls per month</h2><p class="hint">Last 12 months, split by outcome.</p>${monthChart(withD)}<div class="keyrow">${OUT.map(o => `<span><i class="sw" style="background:${o.color}"></i>${o.label}</span>`).join("")}</div></section>
    <section class="panel"><h2>By agency${Y==="all"?"":" · "+Y}</h2><p class="hint">Calls split by outcome.</p>${hbars(group(scope(all), c => c.agency || "Unknown"), 14)}</section>
    <section class="panel"><h2>By role${Y==="all"?"":" · "+Y}</h2><p class="hint">What you are being called for.</p>${hbars(group(scope(all).filter(c => c.role), c => roleKey(c.role)), 14)}</section>
  </div>`;
  main.innerHTML = h;
}
function roleKey(r){ const s = r.trim().toLowerCase().replace(/\s+/g," ").replace(/s$/,""); return s.charAt(0).toUpperCase() + s.slice(1); }
function group(list, fn){
  const m = new Map();
  for (const c of list){ const k = fn(c); if (!m.has(k)) m.set(k, {name:k, total:0, by:{}}); const g = m.get(k); g.total++; const o = outcome(c).k; g.by[o] = (g.by[o]||0)+1; }
  return [...m.values()].sort((a,b) => b.total - a.total || a.name.localeCompare(b.name));
}
function hbars(rows, n){
  if (!rows.length) return `<p class="hint">Nothing yet.</p>`;
  const top = rows.slice(0,n), max = top[0].total;
  let h = `<div class="hbars">`;
  for (const r of top){
    const tip = `${r.name}: ${r.total} calls · ` + OUT.filter(o => r.by[o.k]).map(o => `${r.by[o.k]} ${o.label.toLowerCase()}`).join(", ");
    h += `<div class="hb" data-tip="${esc(tip)}"><span class="nm" title="${esc(r.name)}">${esc(r.name)}</span><span class="track">${OUT.filter(o => r.by[o.k]).map(o => `<span style="width:${r.by[o.k]/max*100}%;background:${o.color}"></span>`).join("")}</span><span class="v">${r.total}</span></div>`;
  }
  if (rows.length > n) h += `<span class="src">+ ${rows.length-n} more</span>`;
  return h + `</div>`;
}
function weekChart(list){
  const end = weekStart(new Date()); const weeks = [];
  for (let i = 15; i >= 0; i--){ const s = new Date(end); s.setDate(end.getDate()-7*i); weeks.push(key(s)); }
  const counts = weeks.map((w,i) => { const nx = i<15 ? weeks[i+1] : addDays(w, 7); return list.filter(c => { const d = basisDate(c); return d >= w && d < nx; }).length; });
  return barSVG(weeks.map((w,i) => ({label: i%4===0 ? fmtDay(w) : "", full:`Week of ${fmtDay(w)}`, segs:[{v:counts[i], color:"var(--accent)", name:"calls"}]})));
}
function monthChart(list){
  const now = new Date(); const months = [];
  for (let i = 11; i >= 0; i--) months.push(new Date(now.getFullYear(), now.getMonth()-i, 1));
  return barSVG(months.map(m => {
    const p = key(m).slice(0,7);
    const these = list.filter(c => basisDate(c).slice(0,7) === p);
    return {label: MONTHS[m.getMonth()].slice(0,3), full:`${MONTHS[m.getMonth()]} ${m.getFullYear()}`, segs: OUT.map(o => ({v: these.filter(c => outcome(c).k===o.k).length, color:o.color, name:o.label.toLowerCase()}))};
  }));
}
function barSVG(cols){
  const W = 520, H = 190, L = 28, B = 22, T = 8;
  const max = Math.max(1, ...cols.map(c => c.segs.reduce((s,x)=>s+x.v,0)));
  const step = max <= 5 ? 1 : max <= 12 ? 2 : max <= 30 ? 5 : 10;
  const top = Math.ceil(max/step)*step;
  const y = v => T + (H-T-B) * (1 - v/top);
  const cw = (W-L)/cols.length, bw = Math.min(28, cw*0.62);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for (let v = 0; v <= top; v += step) s += `<line class="grid" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
  cols.forEach((c,i) => {
    const x = L + cw*i + (cw-bw)/2; let acc = 0;
    const tot = c.segs.reduce((a,b)=>a+b.v,0);
    const tip = `${c.full}: ${tot} call${tot===1?"":"s"}` + (c.segs.length>1 ? " · " + c.segs.filter(g=>g.v).map(g => `${g.v} ${g.name}`).join(", ") : "");
    s += `<g class="col" data-tip="${esc(tip)}"><rect class="hit" x="${L+cw*i}" y="${T}" width="${cw}" height="${H-T-B}"/>`;
    const segs = c.segs.filter(g => g.v);
    segs.forEach((g,j) => {
      const y0 = y(acc), y1 = y(acc+g.v); acc += g.v;
      const isTop = j === segs.length-1;
      const hgt = Math.max(0, y0-y1-(isTop?0:2));
      s += isTop ? `<path class="mark" d="M${x},${y0} V${y1+3} q0,-3 3,-3 h${bw-6} q3,0 3,3 V${y0} Z" fill="${g.color}"/>` : `<rect class="mark" x="${x}" y="${y1+2}" width="${bw}" height="${hgt}" fill="${g.color}"/>`;
    });
    s += `<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${esc(c.label)}</text></g>`;
  });
  return s + `</svg>`;
}

/* ================= money: what each worked job should pay, and what has come in ================= */
/* money is saved on the call as pay: {rate, extras, paid, paidOn, note} – numbers in pounds */
/* £ amounts: whole pounds as "£110", pence as "£95.50" */
function money(n){
  const v = Math.round((n || 0) * 100) / 100;
  const pence = v % 1 !== 0;
  return v.toLocaleString("en-GB", {style:"currency", currency:"GBP", minimumFractionDigits: pence ? 2 : 0, maximumFractionDigits: 2});
}
/* a number, or null when the box is empty / not a number */
const numOrNull = v => (v === null || v === undefined || v === "" || isNaN(Number(v))) ? null : Number(v);
/* the first £ amount in the free-text rate, e.g. "£110 + OT" → 110 */
function rateGuess(text){
  const m = String(text || "").replace(/,/g, "").match(/£\s*(\d+(?:\.\d+)?)/);
  return m ? Number(m[1]) : null;
}
const OVERDUE_DAYS = 45;
const PAY_CHIP = {paid:["Paid","s-confirmed"], part:["Part paid","s-available"], unpaid:["Unpaid","s-canceled"], overdue:["Overdue","pay-over"]};
/* UK tax year: 6 April to 5 April. Gives {from, to, label} for the year that holds day k */
function taxYear(k){
  const y = Number(k.slice(0, 4));
  const start = k >= `${y}-04-06` ? y : y - 1;
  return {from:`${start}-04-06`, to:`${start + 1}-04-05`, label:`${start}/${String(start + 1).slice(2)}`};
}
/* one entry per job with worked days (blue "done" days), newest first */
function moneyJobs(){
  const jobs = [];
  for (const c of callList()){
    const worked = (c.dates || []).filter(e => dayStatus(c, e) === "done").map(e => e.d).sort();
    if (!worked.length) continue;
    const p = c.pay || {};
    const savedRate = numOrNull(p.rate);
    const guess = savedRate === null ? rateGuess(c.rate) : null;   // shown as an estimate
    const rate = savedRate ?? guess;
    const extras = numOrNull(p.extras) || 0;
    const paid = numOrNull(p.paid) || 0;
    const expected = (rate || 0) * worked.length + extras;
    const last = worked[worked.length - 1];
    const ago = Math.round((parse(TODAY) - parse(last)) / 864e5);
    let status = "unpaid";
    if (paid > 0 && paid >= expected - 0.005) status = "paid";
    else if (paid > 0) status = "part";
    else if (ago > OVERDUE_DAYS) status = "overdue";
    jobs.push({c, worked, last, rate, estimate: guess !== null, extras, paid, paidOn: p.paidOn || "", note: p.note || "", expected, status,
      owed: status === "paid" ? 0 : Math.max(0, expected - paid)});
  }
  return jobs.sort((a, b) => b.last.localeCompare(a.last) || nameOf(a.c).localeCompare(nameOf(b.c)));
}
/* what a job earned between two days: rate × worked days in the range (+ extras if its last day is in the range) */
function earnedBetween(j, from, to){
  const days = j.worked.filter(d => d >= from && d <= to).length;
  return (j.rate || 0) * days + (j.last >= from && j.last <= to ? j.extras : 0);
}
const monthName = ym => { const [y, m] = ym.split("-").map(Number); return `${MONTHS[m - 1]} ${y}`; };

function renderMoney(){
  const jobs = moneyJobs();
  const ty = taxYear(TODAY);
  const mFrom = TODAY.slice(0, 7) + "-01", mTo = TODAY.slice(0, 7) + "-31";
  const tyEarned = jobs.reduce((s, j) => s + earnedBetween(j, ty.from, ty.to), 0);
  const tyPaid = jobs.filter(j => j.paidOn >= ty.from && j.paidOn <= ty.to).reduce((s, j) => s + j.paid, 0);
  const moEarned = jobs.reduce((s, j) => s + earnedBetween(j, mFrom, mTo), 0);
  const moDays = jobs.reduce((s, j) => s + j.worked.filter(d => d >= mFrom && d <= mTo).length, 0);
  const owing = jobs.filter(j => j.owed > 0);
  const owed = owing.reduce((s, j) => s + j.owed, 0);
  const overdue = jobs.filter(j => j.status === "overdue");
  const noRate = jobs.filter(j => j.rate === null).length;

  let h = `<div class="bar"><h2 class="month-title" style="margin:0">Money</h2><span class="src">${jobs.length} worked job${jobs.length===1?"":"s"}${noRate?` · ${noRate} without a day rate`:""}</span><span style="flex:1"></span>
    ${jobs.length ? `<button class="btn small" data-moneycsv>Export CSV</button>` : ""}</div>
  <div class="kpis">
    <div class="kpi m"><span class="l">Tax year ${ty.label}</span><span class="n">${money(tyEarned)}</span><span class="s">earned since ${fmtDM(ty.from)} · ${money(tyPaid)} paid</span></div>
    <div class="kpi m"><span class="l">This month</span><span class="n">${money(moEarned)}</span><span class="s">${moDays} day${moDays===1?"":"s"} worked in ${MONTHS[parse(TODAY).getMonth()]}</span></div>
    <div class="kpi m"><span class="l">Owed to you</span><span class="n">${money(owed)}</span><span class="s">${owing.length} job${owing.length===1?"":"s"} unpaid or part paid</span></div>
    <div class="kpi m"><span class="l">Overdue</span><span class="n"${overdue.length?' style="color:var(--attn)"':""}>${overdue.length}</span><span class="s">unpaid ${OVERDUE_DAYS}+ days after the last day</span></div>
  </div>`;
  if (!jobs.length){
    main.innerHTML = h + `<div class="empty"><h2>No worked days yet</h2><p>Days you have worked (blue “done” days) appear here so you can track what each agency owes you.</p></div>`;
    return;
  }
  // by agency
  const ag = new Map();
  for (const j of jobs){
    const k = j.c.agency || "No agency";
    if (!ag.has(k)) ag.set(k, {name:k, days:0, expected:0, paid:0, owed:0});
    const a = ag.get(k);
    a.days += j.worked.length; a.expected += j.expected; a.paid += j.paid; a.owed += j.owed;
  }
  const agRows = [...ag.values()].sort((a, b) => b.expected - a.expected || a.name.localeCompare(b.name));
  h += `<section class="panel"><h2>By agency</h2><div class="agt"><span class="h">Agency</span><span class="h num">Days</span><span class="h num">Expected</span><span class="h num">Paid</span><span class="h num">Owed</span>
    ${agRows.map(a => `<span class="nm" title="${esc(a.name)}">${esc(a.name)}</span><span class="num">${a.days}</span><span class="num">${money(a.expected)}</span><span class="num">${money(a.paid)}</span><span class="num"${a.owed?' style="color:var(--attn)"':""}>${money(a.owed)}</span>`).join("")}</div></section>`;
  // the jobs, grouped by the month of their last worked day
  const months = [...new Set(jobs.map(j => j.last.slice(0, 7)))];
  for (const ym of months){
    const list = jobs.filter(j => j.last.slice(0, 7) === ym);
    const exp = list.reduce((s, j) => s + j.expected, 0), pd = list.reduce((s, j) => s + j.paid, 0);
    h += `<div class="mmonth"><h3 class="wk">${monthName(ym)}</h3><span class="src">${money(exp)} expected · ${money(pd)} paid</span></div>
    <div class="mtable"><div class="mhead"><span>Production</span><span>Days worked</span><span class="num">Day rate</span><span class="num">Expected</span><span class="num">Paid</span><span class="num">Status</span></div>
    ${list.map(moneyRowHTML).join("")}</div>`;
  }
  h += `<p class="src" style="margin:0">Expected = day rate × days worked + extras (overtime, travel, fittings…). Tap a job to add its rate or what you've been paid. Grey rates are guesses from the call's rate text.</p>`;
  main.innerHTML = h;
}
function moneyRowHTML(j){
  const [chip, cls] = PAY_CHIP[j.status];
  const days = j.worked.map(fmtDay);
  const rate = j.rate === null ? `<span class="est">–</span>` : j.estimate ? `<span class="est" title="Guessed from “${esc(j.c.rate)}” – tap to set">${money(j.rate)} <small>est.</small></span>` : money(j.rate);

}

/* fill "amount paid" with the expected total and "paid on" with today */
function payFull(){
  const c = S.calls.get(payId); if (!c) return;
  const days = (c.dates || []).filter(e => dayStatus(c, e) === "done").length;
  const rate = numOrNull($("#p-rate", layer).value) ?? rateGuess(c.rate) ?? 0;
  const extras = numOrNull($("#p-extras", layer).value) || 0;

async function savePay(){
  const v = id => $("#" + id, layer).value.trim();
  const pay = {rate: numOrNull(v("p-rate")), extras: numOrNull(v("p-extras")), paid: numOrNull(v("p-paid")), paidOn: v("p-on") || null, note: v("p-note")};
  if ([pay.rate, pay.extras, pay.paid].some(n => n !== null && n < 0)){ toast("Amounts can't be below zero"); return; }
  if (pay.paid && !pay.paidOn) pay.paidOn = TODAY;      // paid but no date: assume today
  try {
    await S.db.collection("calls").doc(payId).update({pay, updatedAt: new Date().toISOString()});

  } catch (e) { writeFailed(e); }
}

/* a saved time shown in UK time (handles GMT/BST) */
function ukTime(iso){
  const t = new Date(iso);
  if (isNaN(t)) return String(iso);
  return t.toLocaleString("en-GB", {timeZone:"Europe/London", day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"});
}
/* a time in UK time like "Thu 1 Oct 14:05" */
function ukWhen(iso){
  const t = new Date(iso);
  if (isNaN(t)) return String(iso || "");
  const parts = {};
  new Intl.DateTimeFormat("en-GB", {timeZone:"Europe/London", weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit", hourCycle:"h23"})
    .formatToParts(t).forEach(p => parts[p.type] = p.value);
  return `${parts.weekday} ${parts.day} ${parts.month} ${parts.hour}:${parts.minute}`;
}
/* just the UK clock time, like "14:05" */
function ukClock(iso){
  return new Date(iso).toLocaleTimeString("en-GB", {timeZone:"Europe/London", hour:"2-digit", minute:"2-digit", hourCycle:"h23"});
}

/* ---------- undo a robot change ---------- */
/* the robot keeps a short history on each job: what it changed, and the values from before */
function robotHTML(d){
  const hist = Array.isArray(d.history) ? d.history : [];
  if (!hist.length) return "";
  const last = hist[hist.length - 1];
  const older = hist.slice(0, -1).reverse().slice(0, 5);   // newest first, up to 5
  return `<section class="robot">
    <div class="last"><span>Last robot change: <b>${esc(last.what || "change")}</b> · ${esc(ukWhen(last.at))}</span>
      ${last.before ? `<button class="btn small" data-undo ${S.canWrite ? "" : "disabled"}>Undo this change</button>` : ""}</div>
    ${older.length ? `<div class="src">Earlier robot changes</div><ul>${older.map(h => `<li>${esc(h.what || "change")} · ${esc(ukWhen(h.at))}</li>`).join("")}</ul>` : ""}
  </section>`;
}
async function undoRobot(){
  if (!draftId) return;
  const raw = (S.raw && S.raw.get(draftId)) || {};
  const hist = Array.isArray(raw.history) ? raw.history : [];
  const last = hist[hist.length - 1];
  if (!last || !last.before) return;
  // put back only the fields the robot saved from before
  const change = {history: hist.slice(0, -1), updatedAt: new Date().toISOString()};
  for (const f of ["status", "dates", "agency", "project"]) if (f in last.before) change[f] = last.before[f];
  try {
    await S.db.collection("calls").doc(draftId).update(change);
    toast("Undone");
    closeSheet(); render();
  } catch (e) { writeFailed(e); }
}

/* ---------- fix this job: merge a duplicate, split off days ---------- */
let fixOpen = false, mergeWith = null, splitOpen = false;
/* every agency name we know: from your jobs, plus the usual ones */
function agencyListHTML(id){
  const names = [...new Set([...callList().map(c => c.agency), ...Object.values(AGENCY_ALIASES)].filter(Boolean))].sort((a, b) => a.localeCompare(b));

/* a production name with only letters and numbers, e.g. "Tea Time (2)" → "teatime2" */
const normName = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
/* other jobs that look like the same production: one name holds the other (4+ letters)
   and their dates are within 90 days of each other */
function similarJobs(){
  const me = normName(draft.project);
  const myDays = (draft.dates || []).map(e => e.d).filter(Boolean);
  const near = (a, b) => Math.abs(parse(a) - parse(b)) <= 90 * 864e5;
  return callList().filter(c => {
    if (c.id === draftId) return false;
    const other = normName(c.project);
    const short = me.length <= other.length ? me : other, long = short === me ? other : me;
    if (short.length < 4 || !long.includes(short)) return false;
    const theirDays = (c.dates || []).map(e => e.d);
    if (!myDays.length || !theirDays.length) return true;          // no dates to compare: still offer it
    return myDays.some(a => theirDays.some(b => near(a, b)));
  }).sort((a, b) => (firstDate(a) || "").localeCompare(firstDate(b) || ""));
}
function fixHTML(){
  const d = draft;
  const cands = similarJobs();
  const other = mergeWith && S.calls.get(mergeWith);
  const label = c => `${nameOf(c)} · ${c.agency || "No agency"} · ${SMAP[c.status]?.short || c.status}${firstDate(c) ? " · " + fmtShort(firstDate(c)) : ""}`;
  const merge = other
    ? `<div class="confirm"><span>Merge “${esc(label(other))}” into this job? Its days, links, emails, answers and notes move here, then that job is deleted.</span><button class="btn small primary" data-mergeyes>Merge</button><button class="btn small" data-mergeno>Back</button></div>`

      : `<p class="src" style="margin:0">No similar jobs (same production name, dates within 90 days).</p>`;
  const split = !splitOpen
    ? `<div><button class="btn small" data-splitopen ${d.dates.length < 2 ? "disabled" : ""}>Split off days…</button></div>`
    : `<div class="pick">
        <span class="src">Tick the days that belong to a different agency's request.</span>
        <div class="splitdays">${d.dates.map((e, i) => `<label><input type="checkbox" id="sp-${i}"> ${esc(e.d ? fmtShort(e.d) : "no date")} <small class="muted">${kindName(e.kind)}</small></label>`).join("")}</div>
        <div class="fixrow"><input class="inp" id="sp-agency" list="agencies" placeholder="Agency for those days"><button class="btn small primary" data-splityes>Create new job</button><button class="btn small ghost" data-splitno>Cancel</button></div>
      </div>`;
  return `<details class="more" id="fixbox"${fixOpen ? " open" : ""}><summary>Fix this job <span class="src">merge a duplicate, split off days</span></summary>
    <div class="more-in">
