      <div class="fld"><span class="lbl">Split off days</span>${split}</div>
    </div></details>`;
}
/* which status is further along: done beats confirmed beats released … beats expired */
const MERGE_RANK = ["done", "confirmed", "released", "canceled", "declined", "available", "pending", "expired"];
const mergeRank = st => { const i = MERGE_RANK.indexOf(st); return i < 0 ? 99 : i; };
/* the day colour a job's status gives, so days keep their colour after a merge */
const DAY_FOR = {done:"worked", available:"available", pending:"pending", released:"released", canceled:"canceled", declined:"canceled", expired:"canceled"};
const isEmpty = v => v === undefined || v === null || v === "" || (Array.isArray(v) && !v.length);

/* the robot looks jobs up by agency: keep "agencyKey" in step with the agency name
   (same rule as the robot: "Two 10 Casting" = "two10", "Lucas Extras" = "lucas") */
function agencyKeyOf(a){ return String(a || "").toLowerCase().replace(/\b(ltd|limited|casting|extras?|agency|uk|talent|management|the)\b/g, "").replace(/[^a-z0-9]/g, ""); }
async function mergeJobs(){
  const otherId = mergeWith;
  const other = S.raw && S.raw.get(otherId);
  if (!draftId || !other) return;
  pullForm();                                         // keep anything typed in the editor
  const me = draft;
  const status = mergeRank(other.status) < mergeRank(me.status) ? other.status : me.status;
  // a day keeps its own state; a day with none, from a job whose status is different, gets that job's colour
  const dayColour = (e, jobStatus) => (!e.state && jobStatus !== status && DAY_FOR[jobStatus]) ? {...e, state: DAY_FOR[jobStatus]} : {...e};
  // dates: all of this job's days, plus the other job's days on dates this job doesn't have
  const dates = (me.dates || []).map(e => dayColour(e, me.status));
  const myDays = new Set(dates.map(e => e.d));
  (other.dates || []).forEach(e => { if (e && e.d && !myDays.has(e.d)) dates.push(dayColour(e, other.status)); });
  dates.sort((a, b) => String(a.d).localeCompare(String(b.d)));
  // links by url, emails by key, answers by text
  const links = [...(me.links || [])];
  (other.links || []).forEach(l => { if (!links.some(x => x.url === l.url)) links.push(l); });
  const emails = [...(me.emails || [])];
  (other.emails || []).forEach(m => { if (!m.key || !emails.some(x => x.key === m.key)) emails.push(m); });
  const answers = [...new Set([...(me.answers || []), ...(other.answers || [])])];
  const notes = [...new Set([me.notes, other.notes].map(n => (n || "").trim()).filter(Boolean))].join(" • ");
  const out = {...me, status, dates, links, emails, answers, notes, updatedAt: new Date().toISOString()};
  // fill this job's empty fields from the other job
  const skip = new Set(["history", "createdAt", "updatedAt", "newInfo", "newInfoText", "review", "reviewReason", "tidied"]);
  for (const [k, v] of Object.entries(other)) if (!skip.has(k) && isEmpty(out[k]) && !isEmpty(v)) out[k] = v;
  delete out.tidied;                                  // display-only, never saved
  // both changes in one go: either both happen or neither does
  const batch = S.db.batch();
  out.agencyKey = agencyKeyOf(out.agency);
  batch.set(S.db.collection("calls").doc(draftId), out);
  batch.delete(S.db.collection("calls").doc(otherId));
  try {
    await batch.commit();
    toast(`Merged “${nameOf(other)}” into this job`);
    closeSheet(); render();
  } catch (e) { writeFailed(e); }
}

/* split: the ticked days become a new job for another agency, and leave this one */
async function splitJob(){
  const ticked = new Set(draft.dates.map((e, i) => i).filter(i => $("#sp-" + i, layer)?.checked));
  const agency = normAgency($("#sp-agency", layer).value);
  pullForm();
  if (!ticked.size){ toast("Tick the days to split off"); return; }
  if (ticked.size === draft.dates.length){ toast("Leave at least one day on this job"); return; }
  if (!agency){ toast("Type the agency for those days"); $("#sp-agency", layer)?.focus(); return; }
  const now = new Date().toISOString();
  const moved = draft.dates.filter((e, i) => ticked.has(i));
  const kept = draft.dates.filter((e, i) => !ticked.has(i));
  const newId = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const newJob = {...blankCall(), project: draft.project, role: draft.role || "", status: draft.status, agency, dates: moved,
    location: draft.location || "", fitLocation: draft.fitLocation || "", filmLocation: draft.filmLocation || "", rate: draft.rate || "",
    received: draft.received || TODAY, source: "split", notes: `Split off from the ${draft.agency || "other"} job`, createdAt: now, updatedAt: now};
  const body = {...draft, dates: kept, updatedAt: now};
  delete body.tidied;                                 // display-only, never saved
  const batch = S.db.batch();
  body.agencyKey = agencyKeyOf(body.agency); newJob.agencyKey = agencyKeyOf(newJob.agency);
  batch.set(S.db.collection("calls").doc(draftId), body);
  batch.set(S.db.collection("calls").doc(newId), newJob);
  try {
    await batch.commit();
    toast(`${moved.length} day${moved.length === 1 ? "" : "s"} moved to a new ${agency} job`);
    closeSheet(); render();
  } catch (e) { writeFailed(e); }
}

/* ---------- robot health: the robot writes meta/health each time it runs ---------- */
/* fields: lastRun (ISO time), lastNewCall (ISO), unmatched (number), errors (number), message (text) */
S.health = null;
/* "just now", "3 min ago", "2 h ago", "4 days ago" */
function agoText(iso){
  const min = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (isNaN(min)) return "";
  if (min < 1) return "just now";
  if (min < 60) return `${min} min ago`;
  if (min < 48 * 60) return `${Math.floor(min / 60)} h ago`;
  return `${Math.floor(min / 1440)} days ago`;
}
/* the health doc in one shape (older robots wrote at / counts / lines) */
function healthFacts(){
  const h = S.health; if (!h) return null;
  const c = h.counts || {};
  return {lastRun: h.lastRun || h.at || "", lastNewCall: h.lastNewCall || "",
    unmatched: h.unmatched ?? c.unmatched ?? 0, errors: h.errors ?? c.errors ?? 0,
    message: h.message || (Array.isArray(h.lines) ? h.lines.join("\n") : "")};
}
function showHealth(){
  const el = $("#health"), f = healthFacts();
  if (!f || !f.lastRun || isNaN(new Date(f.lastRun))){ el.hidden = true; return; }   // no doc: show nothing
  const min = (Date.now() - new Date(f.lastRun).getTime()) / 60000;
  const colour = min < 15 ? "green" : min < 60 ? "amber" : "red";
  el.hidden = false;
  el.className = "health " + colour;
  el.lastElementChild.textContent = `Robot checked ${agoText(f.lastRun)}`;
  el.title = [`Last run: ${ukWhen(f.lastRun)}`, f.lastNewCall ? `Last new call: ${ukWhen(f.lastNewCall)}` : "", `Unmatched emails: ${f.unmatched}`, `Errors: ${f.errors}`, f.message].filter(Boolean).join("\n");
}
function openHealth(){

  layer.innerHTML = `<div class="scrim" data-close></div><aside class="sheet" role="dialog" aria-label="Robot check">

    <div class="content">
      <dl class="hfacts">
        <dt>Last run</dt><dd>${esc(ukWhen(f.lastRun))} · ${esc(agoText(f.lastRun))}</dd>
        <dt>Last new call</dt><dd>${f.lastNewCall ? esc(ukWhen(f.lastNewCall)) + " · " + esc(agoText(f.lastNewCall)) : "–"}</dd>
        <dt>Unmatched emails</dt><dd>${esc(f.unmatched)}</dd>
        <dt>Errors</dt><dd${f.errors ? ' style="color:var(--attn);font-weight:600"' : ""}>${esc(f.errors)}</dd>
      </dl>
      ${f.message ? `<pre class="raw">${esc(f.message)}</pre>` : `<p class="src" style="margin:0">No message from the robot.</p>`}
      <p class="src" style="margin:0">Green: checked in the last 15 minutes. Amber: in the last hour. Red: longer ago – the robot may have stopped.</p>
    </div>
  </aside>`;
}

function pullForm(){
  if (!draft) return;
  const v = id => { const el = $("#"+id, layer); return el ? el.value.trim() : ""; };
  draft.project = v("f-project"); draft.agency = normAgency(v("f-agency")); draft.role = v("f-role");
  draft.received = v("f-received") || null; draft.respondBy = v("f-respond") || null;
  draft.location = v("f-location"); draft.fitLocation = v("f-fitloc"); draft.filmLocation = v("f-filmloc");
  draft.rate = v("f-rate"); draft.notes = v("f-notes");
  const at = $("#f-attn", layer); if (at) draft.attention = at.checked;
  draft.dates = draft.dates.map((e,i) => {
    const dd = $("#dd-"+i, layer); if (!dd) return e;
    // start from the saved day so extra fields (answer, note…) are kept
    const o = {...e, d: dd.value, kind: $("#dk-"+i, layer).value};
    // the place box shows callPlace if the day has one, else loc – write it back to the same field
    const placeField = e.callPlace ? "callPlace" : "loc";
    const l = $("#dl-"+i, layer).value.trim();
    if (l) o[placeField] = l; else delete o[placeField];
    const ct = $("#dct-"+i, layer)?.value;
    if (ct) o.callTime = ct; else delete o.callTime;
    if ($("#dn-"+i, layer).checked) o.night = true; else delete o.night;
    const st = $("#dst-"+i, layer).value;
    delete o.done;                                   // the day box now says it all
    if (st) o.state = st; else delete o.state;
    return o;
  });
}

      <div class="fld"><label for="imp-received">Date received</label><input class="inp" type="date" id="imp-received" value="${TODAY}"></div>
      <div class="status-line" id="imp-status"></div>
    </div>
    <footer><button class="btn primary" data-extract>Read email</button><button class="btn" data-manual>Type it in</button><span style="flex:1"></span><button class="btn ghost" data-close>Cancel</button></footer>
  </aside>`;
}
function extract(){
  const text = $("#imp-text", layer).value.trim();
  const subject = $("#imp-subject", layer).value.trim();
  const from = $("#imp-from", layer).value.trim();
  const received = $("#imp-received", layer).value || TODAY;
  const st = $("#imp-status", layer);
  if (!text && !subject){ st.className = "status-line err"; st.textContent = "Paste the email text first."; return; }
  const r = window.EmailParser.parseEmail({subject, fromName: from, fromEmail: "", text, received});
  const call = {...blankCall(), source:"pasted email", received,
    project: r.project, agency: normAgency(r.agency), role: r.role, location: r.location, fitLocation: r.fitLocation,
    filmLocation: r.filmLocation, respondBy: r.respondBy || "", rate: r.rate, notes: r.notes, dates: r.dates,
    rawEmail: ((subject ? subject + "\n\n" : "") + text).slice(0, 8000)};
  const dup = callList().find(c => c.project && call.project && c.project.toLowerCase().replace(/[^a-z0-9]/g,"") === call.project.toLowerCase().replace(/[^a-z0-9]/g,"") && (!call.agency || c.agency === call.agency) && ACTIVE.has(c.status));
  preset_note = r.review ? `${r.reviewReason}. Fill in the gaps from the email below.` : "Check the details, then add it.";
  if (dup) preset_note = `You already have “${dup.project}” from ${dup.agency || "this agency"}. Saving here adds a separate entry — or close this and edit the existing one.`;
  openEditor(null, call);
  preset_note = "";
}

/* ================= files: CSV export, backup, restore ================= */
function saveFile(name, text, type){
  const blob = new Blob([text], {type});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function exportCSV(){
  const rows = [["Project","Agency","Role","Status","Attention","Received","Reply by","Fitting dates","Shoot dates","Night dates","Location","Fitting location","Filming location","Rate","Notes"]];
  for (const c of callList().sort((a,b) => (firstDate(a)||"").localeCompare(firstDate(b)||""))){
    const ds = c.dates||[];
    rows.push([c.project,c.agency,c.role,SMAP[c.status]?.short||c.status,c.attention?"yes":"",c.received||"",c.respondBy||"",
      ds.filter(e=>e.kind==="fit").map(e=>e.d).join(" "), ds.filter(e=>e.kind==="film").map(e=>e.d).join(" "), ds.filter(e=>e.night).map(e=>e.d).join(" "),
      c.location,c.fitLocation,c.filmLocation,c.rate,c.notes]);
  }
  const csv = rows.map(r => r.map(v => `"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
  saveFile(`filming-schedule-${TODAY}.csv`, "﻿" + csv, "text/csv");
}
function exportBackup(){
  const all = {};
  for (const [id, rest] of (S.raw || new Map())) all[id] = rest;   // the saved data, not the tidied view
  saveFile(`filming-schedule-backup-${TODAY}.json`, JSON.stringify(all), "application/json");
}
function openMenu(){
  layer.innerHTML = `<div class="scrim" data-close></div><aside class="sheet" role="dialog" aria-label="Backup and account">
    <header><h2>Backup &amp; account</h2><button class="btn small ghost" data-close aria-label="Close">✕</button></header>
    <div class="content">
      <div class="fld"><span class="lbl">Download</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-csv>Spreadsheet (CSV)</button><button class="btn" data-backup>Full backup (JSON)</button></div></div>
      <div class="fld"><span class="lbl">Restore or import a backup</span><p style="margin:0;color:var(--muted)">Adds every call in the file. Calls with the same ID are replaced by the file's version.</p><input class="inp" type="file" id="restoreFile" accept=".json,application/json"></div>
      <div class="status-line" id="restoreStatus"></div>
      <div class="fld"><span class="lbl">Signed in as</span><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span>${esc(S.userEmail||"")}</span><button class="btn small" data-signout>Sign out</button></div></div>
    </div>
  </aside>`;
  $("#restoreFile", layer).addEventListener("change", restoreBackup);
}
async function restoreBackup(e){
  const st = $("#restoreStatus", layer);
  const file = e.target.files[0]; if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch { st.className = "status-line err"; st.textContent = "That file isn't a schedule backup."; return; }
  const ids = Object.keys(data || {});
  if (!ids.length){ st.className = "status-line err"; st.textContent = "The file has no calls in it."; return; }
  st.className = "status-line"; st.textContent = `Importing ${ids.length} calls…`;
  try {
    for (let i = 0; i < ids.length; i += 400){               // Firestore takes up to 500 writes at once
      const batch = S.db.batch();
      ids.slice(i, i + 400).forEach(id => batch.set(S.db.collection("calls").doc(id), data[id]));
      await batch.commit();
    }
    st.textContent = `Imported ${ids.length} calls.`;
  } catch (err) { st.className = "status-line err"; st.textContent = "Import failed: " + (err.message || err); }
}

/* ================= events ================= */
document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-open],[data-close]");
  if (!t) return;
  const ds = t.dataset;
  if (ds.tab){ S.tab = ds.tab; save("tab", S.tab); render(); scrollTo(0,0); return; }
  if ("close" in ds){ closeSheet(); return; }
  if (ds.cycle){ const [id, i] = ds.cycle.split("|"); cycleDay(id, +i); return; }
  if (ds.open && !ds.set){ openEditor(ds.open); return; }
  if (ds.day){
    S.cursor = monthStart(parse(ds.day)); S.calView = "agenda"; S.tab = "calendar"; save("calView2","agenda"); render();
    requestAnimationFrame(() => document.getElementById("d-"+ds.day)?.scrollIntoView({block:"center"})); return;
  }
  if (ds.nav !== undefined){ const n = +ds.nav; S.cursor = n === 0 ? monthStart(new Date()) : new Date(S.cursor.getFullYear(), S.cursor.getMonth()+n, 1); render(); return; }
  if (ds.calview){ S.calView = ds.calview; save("calView2", S.calView); render(); return; }
  if (ds.show){ S.show.has(ds.show) ? S.show.delete(ds.show) : S.show.add(ds.show); save("show", [...S.show]); render(); return; }
  if (ds.basis){ S.basis = ds.basis; save("basis", S.basis); render(); return; }
  if (ds.statyear){ S.statYear = ds.statyear; render(); return; }
  if (ds.set){ setStatus(ds.id, ds.set); return; }
  if (ds.st && draft){ pullForm(); draft.status = ds.st; drawEditor(); return; }
  if (ds.adddate && draft){ pullForm(); const last = draft.dates[draft.dates.length-1]; draft.dates.push({d: last ? last.d : TODAY, kind: ds.adddate}); drawEditor(); $("#dd-"+(draft.dates.length-1), layer)?.focus(); return; }
  if (ds.showloc !== undefined && draft){ pullForm(); const i = +ds.showloc; openLoc.has(i) ? openLoc.delete(i) : openLoc.add(i); drawEditor(); $("#dl-"+i, layer)?.focus(); return; }
  if (ds.deldate !== undefined && draft){ pullForm(); draft.dates.splice(+ds.deldate, 1); drawEditor(); return; }
  if ("save" in ds){ saveDraft(); return; }
  if ("del" in ds){ pullForm(); confirmDel = true; drawEditor(); return; }
  if ("delno" in ds){ pullForm(); confirmDel = false; drawEditor(); return; }
  if ("delyes" in ds){ S.db.collection("calls").doc(draftId).delete().then(() => { toast("Deleted"); closeSheet(); }, writeFailed); return; }
  if ("undo" in ds){ undoRobot(); return; }
  // fix this job: merge (pick → confirm) and split off days
  if ("mergeask" in ds && draft){ const pick = $("#mg-sel", layer)?.value; pullForm(); mergeWith = pick || null; fixOpen = true; drawEditor(); return; }
  if ("mergeno" in ds && draft){ pullForm(); mergeWith = null; fixOpen = true; drawEditor(); return; }
  if ("mergeyes" in ds){ mergeJobs(); return; }
  if ("splitopen" in ds && draft){ pullForm(); splitOpen = true; fixOpen = true; drawEditor(); return; }
  if ("splitno" in ds && draft){ pullForm(); splitOpen = false; fixOpen = true; drawEditor(); return; }
  if ("splityes" in ds){ splitJob(); return; }
  // money tab
  if (ds.pay){ openPay(ds.pay); return; }
  if ("payfull" in ds){ payFull(); return; }
  if ("paysave" in ds){ savePay(); return; }
  if ("moneycsv" in ds){ exportMoneyCSV(); return; }
  if ("health" in ds){ openHealth(); return; }
  if ("extract" in ds){ extract(); return; }
  if ("csv" in ds){ exportCSV(); return; }
  if ("backup" in ds){ exportBackup(); return; }
  if ("signout" in ds){ firebase.auth().signOut(); closeSheet(); return; }
  if ("manual" in ds){ const txt = $("#imp-text", layer)?.value || ""; const rec = $("#imp-received", layer)?.value || TODAY; openEditor(null, {...blankCall(), received: rec, notes: txt.slice(0,600)}); return; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && layer.innerHTML) closeSheet();
  if (e.key === "Enter" && e.target.matches(".row .body, .uphead, .bprod, .nextjob, .bj-head")) openEditor(e.target.dataset.open);
});
document.addEventListener("change", e => {
  if (e.target.classList.contains("dst")) e.target.className = "inp dst dst-" + (e.target.value || "auto");
  if (e.target.classList.contains("dd")){ const w = document.getElementById("dw-" + e.target.id.slice(3)); if (w && e.target.value) w.textContent = DOW[(parse(e.target.value).getDay()+6)%7]; }
  if (e.target.id === "showPastBooked"){ S.showPastBooked = e.target.checked; renderBooked(); }
  if (e.target.id === "statusSel"){ S.listStatus = e.target.value; save("listStatus", S.listStatus); renderCalls(); }
  if (e.target.id === "agencySel"){ S.agency = e.target.value; renderCalls(); }
  if (e.target.id === "sortSel"){ S.sort = e.target.value; save("sort", S.sort); renderCalls(); }
});
// remember whether "Fix this job" is open, so it stays open when the editor redraws
document.addEventListener("toggle", e => { if (e.target.id === "fixbox") fixOpen = e.target.open; }, true);
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-quick]");
  if (a) setStatus(a.dataset.id, a.dataset.quick);
});
$("#addBtn").addEventListener("click", openImporter);
// coming back to the app (e.g. next morning): redraw so "today" is right
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && S.loaded && S.calls.size && !(layer.innerHTML && (draft || payId))) render();
});
$("#exportBtn").addEventListener("click", openMenu);

/* tooltips for charts */
const tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; document.body.appendChild(tip);
document.addEventListener("pointermove", e => {
  const g = e.target.closest?.("[data-tip]");
  if (!g){ tip.hidden = true; return; }
  tip.textContent = g.dataset.tip; tip.hidden = false;
  const x = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8);
  tip.style.left = x + "px"; tip.style.top = (e.clientY + 14) + "px";
});

/* ================= boot: Firebase sign-in and live sync ================= */
/* EP asks the robot for a verification code: type it here and the robot carries on */
function showEpCode(d){
  let box = document.getElementById("epcode");
  const waiting = d && d.status === "waiting" && !d.code && Date.now() - new Date(d.askedAt).getTime() < 8 * 60 * 1000;
  if (!waiting){ if (box) box.remove(); return; }
  if (!box){
    box = document.createElement("section"); box.id = "epcode"; box.className = "epcode";
    main.parentNode.insertBefore(box, main);
    box.innerHTML = `<b>EP sign-in code needed</b><span>EP just sent you a code (by email or text). Type it here so the robot can read your EP portal.</span>
      <form id="epcodeForm"><input class="inp" id="epcodeIn" inputmode="numeric" autocomplete="one-time-code" placeholder="Code" maxlength="10" required><button class="btn primary" type="submit">Send code</button></form>`;
    box.querySelector("form").addEventListener("submit", async ev => {
      ev.preventDefault();
      const code = box.querySelector("#epcodeIn").value.trim();
      if (!code) return;
      try { await S.db.collection("ep").doc("code").update({ code, sentAt: new Date().toISOString() }); toast("Code sent to the robot"); box.remove(); }
      catch (e) { writeFailed(e); }
    });
    box.querySelector("#epcodeIn").focus();
  }
}
function setSync(state, text){ const s = $("#sync"); s.className = "sync " + state; s.lastElementChild.textContent = text; }
function showLogin(msg){
  setSync("", "Signed out");
  $("#addBtn").hidden = true; $("#exportBtn").hidden = true;
  main.innerHTML = `<form class="empty" id="loginForm" style="max-width:420px;margin:24px auto;text-align:left;align-items:stretch">
    <h2>Sign in</h2>
    <div class="fld"><label for="lg-email">Email</label><input class="inp" id="lg-email" type="email" autocomplete="username" required></div>
    <div class="fld"><label for="lg-pass">Password</label><input class="inp" id="lg-pass" type="password" autocomplete="current-password" required></div>
    <button class="btn primary" type="submit" style="justify-content:center">Sign in</button>
    <button class="btn ghost small" type="button" id="lg-forgot" style="justify-content:center">Forgot password? Email me a reset link</button>
    <div class="status-line err" id="lg-msg">${esc(msg||"")}</div>
    <p class="src" style="margin:0">You stay signed in on this device until you press Sign out.</p>
  </form>`;
  $("#lg-forgot").addEventListener("click", async () => {
    const email = $("#lg-email").value.trim();
    const out = $("#lg-msg");
    if (!email){ out.textContent = "Type your email above first, then press this again."; return; }
    try {
      await firebase.auth().sendPasswordResetEmail(email);
      out.className = "status-line"; out.textContent = "Reset link sent to " + email + ". Check your inbox (and spam), choose a new password, then sign in here.";
    } catch (err) { out.className = "status-line err"; out.textContent = "Couldn't send the reset email. Check the address is the one you use for this app."; }
  });
  $("#loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    $("#lg-msg").textContent = "";
    try { await firebase.auth().signInWithEmailAndPassword($("#lg-email").value.trim(), $("#lg-pass").value); }
    catch (err) {
      const why = {
        "auth/invalid-credential": "Wrong email or password. If you just reset it, use the NEW password.",
        "auth/wrong-password": "Wrong password. If you just reset it, use the NEW password.",
        "auth/user-not-found": "There is no account with this email. Use one of the emails added in Firebase → Authentication → Users.",
        "auth/invalid-email": "That email address doesn't look right. Check for a missing letter or an extra space.",
        "auth/too-many-requests": "Too many tries. Wait a few minutes, or reset the password with the link below.",
        "auth/network-request-failed": "No connection to Firebase. Check the phone's internet (Wi-Fi or data) and try again.",
        "auth/user-disabled": "This account is switched off in Firebase.",
      }[err.code];
      $("#lg-msg").textContent = (why || "Couldn't sign in.") + " (" + (err.code || err.message) + ")";
    }
  });
}
(function boot(){
  const cfg = window.FIREBASE_CONFIG;
  if (!window.firebase || !cfg || !cfg.apiKey || cfg.apiKey.indexOf("PASTE") === 0){
    setSync("err","Not set up");
    main.innerHTML = `<div class="empty"><h2>Almost there</h2><p>Add your Firebase settings to <b>firebase-config.js</b> (see SETUP.md), then reload this page.</p></div>`;
    return;
  }
  firebase.initializeApp(cfg);
  // stay signed in on this device until "Sign out" is pressed
  firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
  const db = firebase.firestore();
  db.enablePersistence({synchronizeTabs: true}).catch(() => {});   // works offline too
  S.db = db;
  let unsub = null, healthUnsub = null;
  firebase.auth().onAuthStateChanged(user => {
    if (unsub){ unsub(); unsub = null; }
    if (!user){ if (healthUnsub){ healthUnsub(); healthUnsub = null; } S.health = null; showHealth(); S.loaded = false; S.calls = new Map(); S.raw = new Map(); showLogin(); return; }
    S.userEmail = user.email;
    $("#addBtn").hidden = false; $("#exportBtn").hidden = false;
    main.innerHTML = `<div class="empty"><h2>Loading your calls</h2></div>`;
    // EP sign-in code: when the EP robot asks, a yellow box appears at the top
    db.collection("ep").doc("code").onSnapshot(d => showEpCode(d.exists ? d.data() : null), () => {});
    // robot health: a slim line next to the sync badge (errors are ignored)
    if (healthUnsub) healthUnsub();
    healthUnsub = db.collection("meta").doc("health").onSnapshot(d => { S.health = d.exists ? d.data() : null; showHealth(); }, () => { S.health = null; showHealth(); });
    let firstSnap = true, lastFromCache = null;
    unsub = db.collection("calls").onSnapshot({includeMetadataChanges: true}, snap => {
      // skip events where only Firebase's own flags changed (nothing in your calls, still online/offline as before)
      const fromCache = snap.metadata.fromCache;
      if (!firstSnap && fromCache === lastFromCache && !snap.docChanges().length) return;
      firstSnap = false; lastFromCache = fromCache;
      S.raw = new Map(snap.docs.map(d => [d.id, d.data()]));   // exactly what's in the database
      TODAY = key(new Date());
      retidy();                                                // what you see (old jobs tidied)
      S.loaded = true;
      setSync(snap.metadata.fromCache ? "" : "live", snap.metadata.fromCache ? "Offline copy" : `Live · ${S.calls.size} calls`);
      if (!S.calls.size){
        main.innerHTML = `<div class="empty"><h2>No calls yet</h2><p>Import your backup file from “Backup”, or add your first availability check with “+ Add availability check”.</p></div>`;
        return;
      }
      if (layer.innerHTML && (draft || payId)) return;   // don't redraw under the editor
      const hadFocus = document.activeElement?.id === "q";
      render();
      if (hadFocus) $("#q")?.focus();
    }, err => {
      setSync("err", "Can't reach the database");
      if (err.code === "permission-denied") {
        const who = firebase.auth().currentUser?.email || "this account";
        firebase.auth().signOut();
        showLogin("You signed in as " + who + ", but that email isn't in the database rules, so the schedule stays locked. Sign in with the other email, or add this one in Firebase → Firestore → Rules.");
      }
    });
  });
})();

/* phone app: keep the app files on the device so it opens fast (errors are ignored) */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
